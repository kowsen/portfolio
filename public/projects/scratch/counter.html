<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'IBM Plex Mono', monospace;
        }

        #counter-container {
            width: 100%;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            user-select: none;
        }

        #counter {
            font-size: clamp(2rem, 11vw, 20rem);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        #secondary-counter {
            font-size: clamp(1rem, 5vw, 8rem);
            color: #666666;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        #settings-anchor {
            position: fixed;
            bottom: 20px;
            right: 20px;
            opacity: 0.1;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            background: rgba(10, 10, 10, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        #settings-anchor:hover {
            opacity: 1;
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #555;
            width: 90px;
            text-align: right;
        }

        input {
            background: #000;
            border: 1px solid #333;
            color: #fff;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            outline: none;
        }

        input:focus {
            border-color: #666;
        }

        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        input[type="number"] {
            width: 100px;
        }
    </style>
</head>
<body>

    <div id="counter-container">
        <div id="counter">0.00</div>
        <div id="secondary-counter">0.00</div>
    </div>

    <div id="settings-anchor">
        <div class="setting-group">
            <label for="start-picker">Start</label>
            <input type="datetime-local" id="start-picker">
        </div>
        <div class="setting-group">
            <label for="pay-input">Annual Pay</label>
            <input type="number" id="pay-input" step="1000">
        </div>
        <div class="setting-group">
            <label for="exp-input">Monthly Exp</label>
            <input type="number" id="exp-input" step="100">
        </div>
    </div>

    <script>
        const FALLBACK_PAY = 50000;
        const FALLBACK_MONTHLY_EXP = 2500;
        const MS_IN_YEAR = 365 * 24 * 60 * 60 * 1000;

        // Initialize with safe defaults immediately
        const now = new Date();
        // Default start: Jan 1st of current year (ensures visible number)
        let startTimestamp = new Date(now.getFullYear(), 0, 1).getTime();
        let annualPay = FALLBACK_PAY;
        let monthlyExp = FALLBACK_MONTHLY_EXP;

        const counterElement = document.getElementById('counter');
        const secondaryElement = document.getElementById('secondary-counter');
        const startPicker = document.getElementById('start-picker');
        const payInput = document.getElementById('pay-input');
        const expInput = document.getElementById('exp-input');

        function init() {
            // CRITICAL FIX: Start the loop immediately. 
            // Even if URL parsing fails, the counter will run with defaults.
            requestAnimationFrame(updateCounter);

            try {
                const urlParams = new URLSearchParams(window.location.search);
                
                // 1. Get/Set Start Time
                const paramStart = urlParams.get('startTimestamp');
                if (paramStart) {
                    if (/^\d+$/.test(paramStart)) {
                        const t = parseInt(paramStart, 10);
                        if (!isNaN(t)) startTimestamp = t;
                    } else {
                        const t = new Date(paramStart).getTime();
                        if (!isNaN(t)) startTimestamp = t;
                    }
                }

                // 2. Get/Set Rates
                const pRate = parseFloat(urlParams.get('payRate'));
                if (!isNaN(pRate)) annualPay = pRate;

                const eRate = parseFloat(urlParams.get('monthlyExpense'));
                if (!isNaN(eRate)) monthlyExp = eRate;

            } catch (err) {
                console.warn("URL parsing failed, using defaults", err);
            }

            // 3. UI Sync
            payInput.value = annualPay;
            expInput.value = monthlyExp;
            syncPickerUI(startTimestamp);

            // 4. Persistence
            safeUpdateURL();

            // 5. Handlers
            startPicker.addEventListener('change', (e) => {
                const d = new Date(e.target.value);
                if (!isNaN(d.getTime())) {
                    startTimestamp = d.getTime();
                    safeUpdateURL();
                }
            });

            payInput.addEventListener('input', updatePay);
            payInput.addEventListener('change', updatePay);

            expInput.addEventListener('input', updateExp);
            expInput.addEventListener('change', updateExp);
        }

        function updatePay(e) {
            const val = parseFloat(e.target.value);
            if (!isNaN(val)) {
                annualPay = val;
                safeUpdateURL();
            }
        }

        function updateExp(e) {
            const val = parseFloat(e.target.value);
            if (!isNaN(val)) {
                monthlyExp = val;
                safeUpdateURL();
            }
        }

        function syncPickerUI(ts) {
            try {
                const dateObj = new Date(ts);
                const tzOffset = dateObj.getTimezoneOffset() * 60000;
                const localISOTime = (new Date(dateObj - tzOffset)).toISOString().slice(0, 16);
                startPicker.value = localISOTime;
            } catch (e) {
                console.warn("UI Sync failed", e);
            }
        }

        function safeUpdateURL() {
            try {
                const url = new URL(window.location);
                url.searchParams.set('startTimestamp', startTimestamp);
                url.searchParams.set('payRate', annualPay);
                url.searchParams.set('monthlyExpense', monthlyExp);
                window.history.replaceState({}, '', url);
            } catch (e) {
                // If history API fails (e.g. inside specific iframe constraints), ignore it.
                // The counter will still work visually.
            }
        }

        function updateCounter() {
            const now = Date.now();
            const elapsed = now - startTimestamp;

            // Math
            const timeFactor = elapsed / MS_IN_YEAR;
            
            const gross = timeFactor * annualPay;
            const expenses = timeFactor * (monthlyExp * 12);
            const net = gross - expenses;

            const formatOptions = {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            };

            counterElement.textContent = net.toLocaleString('en-US', formatOptions);
            secondaryElement.textContent = gross.toLocaleString('en-US', formatOptions);

            requestAnimationFrame(updateCounter);
        }

        init();
    </script>
</body>
</html>
