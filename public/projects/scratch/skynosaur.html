<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skynosaur</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Anchor to the top */
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            background-color: #e0f8d0;
            border: 4px solid #081820;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            
            aspect-ratio: 9 / 16;
            width: 100%;
            max-width: calc(100dvh * 9 / 16);
            height: 100%;
            max-height: calc(100vw * 16 / 9);
            overflow: hidden;
            container-type: size;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; 
            touch-action: none;
        }

        /* --- Crisp HTML UI Overlay --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
        }

        #score-display {
            position: absolute;
            top: 16.25%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* Scale precisely with container width to stay proportional at all resolutions */
            font-size: 25cqw;
            font-weight: 700;
            line-height: 1;
            margin: 0;
            padding: 0;
            
            /* Dark Green palette color #346856 with transparency */
            color: rgba(52, 104, 86, 0.4);
            text-align: center;
            z-index: 1;
            white-space: nowrap;
            /* Heartbeat score juice */
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #score-display.pop {
            transform: translate(-50%, -50%) scale(1.25);
        }

        #menu-screen {
            position: absolute;
            top: 150%; /* Start off-screen */
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(224, 248, 208, 0.98);
            border: 4px solid #081820;
            padding: 6cqw;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 3cqw;
            color: #346856; 
            width: 80%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 10;
            transition: top 0.5s ease-out;
        }

        #menu-screen.visible {
            top: 50%;
        }

        .menu-title { 
            font-size: 8cqw; 
            font-weight: bold; 
            color: #081820; 
            margin-bottom: 1cqw;
        }
        .menu-text { 
            font-size: 4.5cqw; 
            font-weight: bold; 
        }
        .menu-instruction { 
            font-size: 3.5cqw; 
            margin-top: 2cqw; 
            color: #88c070; 
            transition: opacity 0.3s ease-in;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="144" height="256"></canvas>
        
        <div id="ui-layer">
            <div id="score-display">0</div>
            <div id="menu-screen">
                <div class="menu-title" id="menu-title">READY?</div>
                <div class="menu-text" id="menu-score">Swipe Forwards to Jump</div>
                <div class="menu-text" id="menu-highscore">Swipe Backwards to Backflip</div>
                <div class="menu-instruction" id="menu-instruction">[TAP] to Start</div>
            </div>
        </div>
    </div>

    <script>
        // ==============================================================================
        // CONSTANTS & BITMASKS
        // ==============================================================================
        const PALETTE = { bg: '#e0f8d0', light: '#88c070', dark: '#346856', black: '#081820' };

        const PAD_RIGHT = 0x01;
        const PAD_LEFT  = 0x02;
        const PAD_UP    = 0x04;
        const PAD_DOWN  = 0x08;
        const PAD_A     = 0x10; 

        const STATE_STAND    = 0x00;
        const STATE_WALK     = 0x01;
        const STATE_SKID     = 0x02;
        const STATE_JUMP     = 0x03;
        const STATE_FALL     = 0x04;
        const STATE_BACKFLIP = 0x05;

        const GRAVITY_ORIGINAL  = 0x0038; 
        const BACKFLIP_FORCE    = 0xFA60; 
        const JUMP_FORCE        = 0xFBC0; 
        const TERM_VELOCITY     = 0x0400; 
        const WALK_ACCEL        = 0x0014;
        const FRICTION          = 0x0019;
        const MAX_WALK_SPEED    = 0x0180; 

        const FLOOR_SPACING = 64; 
        const CHUNK_WIDTH = 320;

        // ==============================================================================
        // CORE ENGINE STATE
        // ==============================================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const menuScreen = document.getElementById('menu-screen');
        const menuTitle = document.getElementById('menu-title');
        const menuScore = document.getElementById('menu-score');
        const menuHighscore = document.getElementById('menu-highscore');
        const menuInstruction = document.getElementById('menu-instruction');

        let gameState = 'START'; 
        let topFloor = 0;
        let currentFloor = 0;
        let autoDirection = 1; 
        let cameraX = 0;
        let cameraY = -196;
        let targetCameraY = -196; 
        let frameCount = 0; 
        let globalSeed = 0;
        let gameOverTime = 0;
        let globalTimeScale = 1.0;
        
        let highScore = parseInt(localStorage.getItem('gb_runner_highscore')) || 0;

        let wMarioX, wMarioY, wMarioVX, wMarioVY, wMarioState, wMarioFacing;
        let backflipStartFloor = 0;
        let activeEntities = [];
        let floorCliffs = {}; 

        // PERFORMANCE: TIME-SLICED CHUNK GENERATION & CACHING
        let spawnedChunks = new Set();
        let chunkCache = new Map(); 
        let chunkQueue = [];
        let queuedChunks = new Set();

        // RENDER INTERPOLATION PREV-STATE
        let prevWMarioX = 0, prevWMarioY = 0;
        let prevCameraX = 0, prevCameraY = -196;
        let prevVisualRotation = 0;
        let prevDeathAnimationX = 0, prevDeathAnimationY = 0;

        // JUICE STATE
        let particles = [];
        let ghosts = [];
        let cameraShake = 0;
        let flashTimer = 0;
        let deathAnimationX = 0;
        let deathAnimationY = 0;
        let deathAnimationVY = 0;
        let visualRotation = 0;

        const input = {
            rawJump: false,
            discreteJump: false,
            discreteFlip: false,
            menuTap: false,
            rightHeld: false,
            leftHeld: false
        };

        let hJoypadDown = 0;
        let hJoypadPressed = 0;
        let lastJoypadDown = 0;
        let lastMenuAction = false;

        // ==============================================================================
        // MATH & UTILITIES
        // ==============================================================================
        function addQ88(pos, vel) {
            let signedVel = (vel & 0x8000) ? (vel | 0xFFFF0000) : vel;
            return pos + signedVel; 
        }

        function prng(seed1, seed2, seed3) {
            let h = Math.imul(seed1 ^ seed2, 2654435761) ^ seed3;
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h >>> 0) / 4294967296;
        }

        function getDifficulty(floorN) {
            return Math.floor((floorN + 6) / 12);
        }

        // ==============================================================================
        // INPUT HANDLERS
        // ==============================================================================
        window.addEventListener('keydown', (e) => {
            if (['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', 'Space', 'KeyD', 'KeyA', 'KeyW', 'KeyZ'].includes(e.code)) {
                e.preventDefault();
            }
            if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                if (!input.rightHeld) {
                    if (autoDirection === 1) input.discreteJump = true;
                    else input.discreteFlip = true;
                    input.rightHeld = true;
                }
            }
            if (e.code === 'ArrowLeft'  || e.code === 'KeyA') {
                if (!input.leftHeld) {
                    if (autoDirection === -1) input.discreteJump = true;
                    else input.discreteFlip = true;
                    input.leftHeld = true;
                }
            }
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyZ' || e.code === 'Space') {
                input.rawJump = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', 'Space', 'KeyD', 'KeyA', 'KeyW', 'KeyZ'].includes(e.code)) {
                e.preventDefault();
            }
            if (e.code === 'ArrowRight' || e.code === 'KeyD') input.rightHeld = false;
            if (e.code === 'ArrowLeft'  || e.code === 'KeyA') input.leftHeld = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyZ' || e.code === 'Space') {
                input.rawJump = false;
            }
        });

        let activePointers = {};
        canvas.addEventListener('pointerdown', (e) => {
            window.focus();
            e.preventDefault();
            try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
            if (gameState !== 'PLAYING') input.menuTap = true; 
            activePointers[e.pointerId] = { startX: e.clientX, startY: e.clientY, triggered: false };
        });

        canvas.addEventListener('pointermove', (e) => {
            e.preventDefault();
            if (gameState !== 'PLAYING') return;
            let pointerData = activePointers[e.pointerId];
            if (pointerData && !pointerData.triggered) {
                let deltaX = e.clientX - pointerData.startX;
                let deltaY = e.clientY - pointerData.startY;
                if (Math.abs(deltaX) > 15 || Math.abs(deltaY) > 15) {
                    pointerData.triggered = true;
                    if (Math.abs(deltaY) > Math.abs(deltaX) && deltaY < -15) {
                        input.discreteJump = true; 
                    } else if (Math.abs(deltaX) > 15) {
                        let swipeDir = deltaX > 0 ? 1 : -1;
                        if (swipeDir === autoDirection) input.discreteJump = true; 
                        else input.discreteFlip = true;
                    }
                }
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            e.preventDefault();
            try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
            delete activePointers[e.pointerId];
        });

        // ==============================================================================
        // GENERATION LOGIC (CACHED & OPTIMIZED)
        // ==============================================================================
        
        function queueChunkGeneration(cx, f) {
            let key = cx + ',' + f;
            if (!chunkCache.has(key) && !queuedChunks.has(key)) {
                queuedChunks.add(key);
                chunkQueue.push({cx, f, key});
            }
        }

        // Only calculates the PRNG layout of a chunk once per game, caching the static geometry.
        function getCachedChunk(chunkX, floorN) {
            let key = chunkX + ',' + floorN;
            if (chunkCache.has(key)) return chunkCache.get(key);

            let holes = [];
            if (floorN > 0) {
                let diff = getDifficulty(floorN);
                
                // TETRIS-STYLE BAG RANDOMIZER FOR HOLES
                let HOLE_BAG_SIZE = 5;
                let hBlockId = Math.floor(chunkX / HOLE_BAG_SIZE);
                let hLocalIdx = ((chunkX % HOLE_BAG_SIZE) + HOLE_BAG_SIZE) % HOLE_BAG_SIZE;
                
                let hBag = [1, 1, 1, 1, 1]; 
                if (floorN >= 6) {
                    hBag = [1, 1, 1, 2, 2]; // Exactly two 2-hole chunks per bag
                } else if (floorN >= 2) {
                    hBag = [1, 1, 1, 1, 0]; // Exactly one breather chunk per bag
                }
                
                // Shuffle the hole bag
                for (let i = HOLE_BAG_SIZE - 1; i > 0; i--) {
                    let j = Math.floor(prng(floorN ^ globalSeed, hBlockId, 50 + i) * (i + 1));
                    [hBag[i], hBag[j]] = [hBag[j], hBag[i]];
                }
                
                let numHoles = hBag[hLocalIdx];

                if (numHoles > 0) {
                    let prevHoles = (floorN > 1) ? getCachedChunk(chunkX, floorN - 1).holes : [];
                    let prevLocalX = prevHoles.length > 0 ? prevHoles[0].baseX - (chunkX * CHUNK_WIDTH) : null;
                    let lastMaxBound = -Infinity;
                    let dynamicHolesUsed = 0;

                    for (let i = 0; i < numHoles; i++) {
                        let rHole = prng(floorN ^ globalSeed, chunkX, 1 + i);
                        let rHoleW = prng(floorN ^ globalSeed, chunkX, 4 + i);
                        let localX = 40 + Math.floor(rHole * (200 / numHoles)) + (i * (CHUNK_WIDTH / numHoles));

                        if (prevLocalX !== null && i === 0) {
                            let diffLevel = Math.min(4, Math.floor(floorN / 8)); 
                            if (diffLevel <= 1) { 
                                let minStagger = diffLevel === 0 ? 120 : 80;
                                if (Math.abs(localX - prevLocalX) < minStagger) localX = prevLocalX > (CHUNK_WIDTH / 2) ? prevLocalX - minStagger : prevLocalX + minStagger;
                            } else if (diffLevel >= 3) { 
                                let maxAlign = diffLevel === 3 ? 64 : 32;
                                if (Math.abs(localX - prevLocalX) > maxAlign) localX = prevLocalX + (localX > prevLocalX ? maxAlign : -maxAlign);
                            }
                            localX = Math.max(32, Math.min(CHUNK_WIDTH - 48, localX));
                        }

                        let holeX = chunkX * CHUNK_WIDTH + localX;
                        holeX = Math.floor(holeX / 8) * 8; 
                        let rType = prng(floorN ^ globalSeed, chunkX, 20 + i);
                        let holeType = 0;
                        if (dynamicHolesUsed === 0) {
                            if (floorN >= 6 && rType > 0.6) { holeType = 2; dynamicHolesUsed++; }
                            else if (floorN >= 4 && rType > 0.45) { holeType = 1; dynamicHolesUsed++; }
                        }

                        let widths = [2, 3, 4, 5];
                        let widthTiles = (holeType === 2) ? Math.max(2, 4 - Math.min(4, Math.floor((floorN - 6) / 5))) : 
                                         (diff === 0) ? widths[1 + Math.floor(rHoleW * 2)] : (diff === 1) ? widths[Math.floor(rHoleW * 4)] : 
                                         (rHoleW < 0.4) ? 2 : (rHoleW < 0.8) ? 5 : (rHoleW < 0.9) ? 3 : 4;
                        
                        let currentW = widthTiles * 8;
                        let minBound = holeX, maxBound = holeX + currentW;

                        if (holeType === 2) { minBound = holeX - 24; maxBound = holeX + currentW + 24; }
                        else if (holeType === 1) { let maxW = currentW + (12 + diff * 2); let midX = holeX + currentW / 2; minBound = midX - maxW / 2; maxBound = midX + maxW / 2; }

                        if (i > 0 && minBound < lastMaxBound + 64) {
                            let shift = Math.ceil(((lastMaxBound + 64) - minBound) / 8) * 8;
                            holeX += shift; minBound += shift; maxBound += shift;
                        }

                        holes.push({ baseX: holeX, baseW: currentW, type: holeType, amplitude: 24, minBound: minBound, maxBound: maxBound, diff: diff, chunkX: chunkX });
                        lastMaxBound = maxBound;
                    }
                }
            }
            let chunkData = { holes: holes };
            chunkCache.set(key, chunkData);
            return chunkData;
        }

        // Lightweight function to evaluate dynamic hole offsets using fractional frameTime for 144hz smoothness
        function getDynamicHoles(chunkX, floorN, frameTime) {
            let chunk = getCachedChunk(chunkX, floorN);
            let dynamicHoles = [];
            for (let h of chunk.holes) {
                let currentOffset = 0;
                let currentW = h.baseW;
                
                if (h.type === 2) {
                    currentOffset = Math.sin(frameTime * (0.02 + h.diff * 0.005) + h.chunkX) * 24;
                } else if (h.type === 1) {
                    let newW = Math.max(16, h.baseW + Math.sin(frameTime * (0.02 + h.diff * 0.005) + h.chunkX) * (12 + h.diff * 2));
                    currentOffset = (h.baseW - newW) / 2; 
                    currentW = newW;
                }
                dynamicHoles.push({
                    x: h.baseX + currentOffset,
                    w: currentW,
                    baseX: h.baseX,
                    baseW: h.baseW,
                    type: h.type,
                    minBound: h.minBound,
                    maxBound: h.maxBound
                });
            }
            return dynamicHoles;
        }

        function registerFloorLanding(floorN, startX, dirX) {
            if (floorCliffs[floorN] !== undefined) return; 
            if (floorN <= 0) { floorCliffs[floorN] = { x: startX + (dirX * 999999), dir: dirX }; return; }
            let holesFound = 0, chunkX = Math.floor(startX / CHUNK_WIDTH), cliffX = null;
            for (let i = 0; i < 50; i++) { 
                let holes = getCachedChunk(chunkX, floorN).holes;
                let sortedHoles = [...holes];
                if (dirX === 1) sortedHoles.sort((a, b) => a.baseX - b.baseX); else sortedHoles.sort((a, b) => b.baseX - a.baseX);
                for (let hole of sortedHoles) {
                    if ((dirX === 1 && hole.baseX > startX) || (dirX === -1 && hole.baseX < startX)) {
                        if (++holesFound === 4) {
                            cliffX = (dirX === 1) ? hole.baseX + (hole.type === 2 ? 24 : 0) + hole.baseW + 48 : hole.baseX - (hole.type === 2 ? 24 : 0) - 48;
                            break;
                        }
                    }
                }
                if (cliffX !== null) break; chunkX += dirX;
            }
            floorCliffs[floorN] = { x: cliffX || (startX + (dirX * 5000)), dir: dirX }; 
        }

        function getSolidType(px, py) {
            let floorN = Math.floor((-py + 8) / FLOOR_SPACING);
            if (floorN <= 0) return (py >= 0) ? 1 : 0; 
            let floorY = -floorN * FLOOR_SPACING;
            if (py >= floorY && py < floorY + 8) {
                let cliff = floorCliffs[floorN];
                if (cliff && ((cliff.dir === 1 && px >= cliff.x) || (cliff.dir === -1 && px <= cliff.x))) return 0; 
                
                // Aggressive neighborhood check (± 2 chunks) totally eliminates dynamic hole clipping on boundaries
                let centerChunk = Math.floor(px / CHUNK_WIDTH);
                for (let cx = centerChunk - 2; cx <= centerChunk + 2; cx++) {
                    let holes = getDynamicHoles(cx, floorN, frameCount); 
                    for (let hole of holes) {
                        if (px >= hole.x && px < hole.x + hole.w) return 0; 
                    }
                }
                return 1; 
            }
            return 0; 
        }

        function spawnEntitiesForChunk(chunkX, floorN) {
            if (floorN <= 0) return; 
            let chunkId = chunkX + ',' + floorN;
            if (spawnedChunks.has(chunkId)) return;
            spawnedChunks.add(chunkId);
            let floorY = -floorN * FLOOR_SPACING, diff = getDifficulty(floorN), cliff = floorCliffs[floorN];
            
            // TETRIS-STYLE BAG RANDOMIZER FOR ENTITIES
            let BAG_SIZE = 4;
            let blockId = Math.floor(chunkX / BAG_SIZE);
            let localIdx = ((chunkX % BAG_SIZE) + BAG_SIZE) % BAG_SIZE;
            
            let numObstacles = 3; // 75% coverage at diff 0
            if (diff === 1) numObstacles = prng(floorN ^ globalSeed, blockId, 100) > 0.5 ? 4 : 3;
            else if (diff >= 2) numObstacles = prng(floorN ^ globalSeed, blockId, 100) > 0.15 ? 4 : 3;
            
            let bag = [0, 1, 2, 3];
            for (let i = BAG_SIZE - 1; i > 0; i--) {
                let j = Math.floor(prng(floorN ^ globalSeed, blockId, i) * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
            
            let spawnEntity = false;
            for (let i = 0; i < numObstacles; i++) {
                if (bag[i] === localIdx) { spawnEntity = true; break; }
            }

            if (spawnEntity) {
                let chunk = getCachedChunk(chunkX, floorN);
                let obsX;
                let validPlacement = false;
                
                // Smart placement: try up to 5 times to avoid placing an entity inside a hole
                for (let attempt = 0; attempt < 5; attempt++) {
                    obsX = chunkX * CHUNK_WIDTH + 40 + Math.floor(prng(floorN ^ globalSeed, chunkX, 3 + attempt) * 240);
                    validPlacement = true;
                    
                    if (cliff && ((cliff.dir === 1 && obsX >= cliff.x) || (cliff.dir === -1 && obsX <= cliff.x))) {
                        validPlacement = false;
                        continue;
                    }
                    
                    for (let hole of chunk.holes) {
                        let m = (hole.type === 2) ? hole.amplitude : (hole.type === 1 ? 16 : 0);
                        if (obsX >= hole.baseX - m - 32 && obsX <= hole.baseX + m + hole.baseW + 32) {
                            validPlacement = false;
                            break;
                        }
                    }
                    if (validPlacement) break;
                }
                
                if (!validPlacement) return; // Discard spawn if no valid solid ground was found
                
                let r = prng(floorN ^ globalSeed, chunkX, 5), type = 'SPIKE', dirX = (obsX > chunkX * CHUNK_WIDTH + CHUNK_WIDTH / 2) ? -1 : 1;
                
                // Heavily favor SPIKE
                if (diff === 0 && r > 0.8) type = 'PATROL';
                else if (diff === 1) type = (r > 0.95) ? 'CANNON' : (r > 0.90) ? 'BOUNCER' : (r > 0.8) ? 'PATROL' : 'SPIKE';
                else if (diff >= 2) type = (r > 0.96) ? 'WAVER' : (r > 0.92) ? 'CANNON' : (r > 0.85) ? 'BOUNCER' : (r > 0.75) ? 'PATROL' : 'SPIKE';
                
                if (type === 'BOUNCER') {
                    activeEntities.push({ type, x: obsX, y: floorY - 8, prevX: obsX, prevY: floorY - 8, baseFloorY: floorY, vx: dirX * Math.min(2.5, 1.6 + (diff * 0.2)), vy: -2.0, dirX, timer: 0 });
                } else if (type === 'WAVER') {
                    activeEntities.push({ type, x: obsX, y: floorY - 24, prevX: obsX, prevY: floorY - 24, startY: floorY - 24, vx: dirX * Math.min(2.8, 1.6 + (diff * 0.2)), dirX, timer: 0 });
                } else if (type === 'PATROL' || type === 'CANNON') {
                    activeEntities.push({ type, x: obsX, y: floorY, prevX: obsX, prevY: floorY, vx: (type === 'PATROL') ? (dirX * Math.min(2.5, 1.6 + (diff * 0.15))) : 0, dirX, fireRate: Math.max(80, 240 - (diff * 30)), bulletSpeed: Math.min(2.5, 1.2 + (diff * 0.15)), timer: 0 });
                } else if (type === 'SPIKE') {
                    activeEntities.push({ type, x: obsX, y: floorY, prevX: obsX, prevY: floorY, vx: 0, dirX });
                    // Cluster logic: 3x more common via clustering beds of spikes
                    if (prng(floorN ^ globalSeed, chunkX, 6) > 0.4) {
                        activeEntities.push({ type, x: obsX + 10, y: floorY, prevX: obsX + 10, prevY: floorY, vx: 0, dirX });
                    }
                    // Gate the 3rd spike until after the first difficulty spike
                    if (diff > 0 && prng(floorN ^ globalSeed, chunkX, 7) > 0.7) {
                        activeEntities.push({ type, x: obsX + 20, y: floorY, prevX: obsX + 20, prevY: floorY, vx: 0, dirX });
                    }
                }
            }
        }

        // ==============================================================================
        // PHYSICS & LOOP
        // ==============================================================================
        function triggerGameOver() {
            if (gameState === 'DYING' || gameState === 'GAMEOVER') return;
            gameState = 'DYING';
            let px = Math.floor(wMarioX / 256), py = Math.floor(wMarioY / 256);
            deathAnimationX = px; deathAnimationY = py - 7; deathAnimationVY = -4.0;
            prevDeathAnimationX = deathAnimationX; prevDeathAnimationY = deathAnimationY;
            cameraShake = 15;
            globalTimeScale = 1.0;
            for(let i=0; i<12; i++) particles.push({ x: px, y: py - 7, prevX: px, prevY: py - 7, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, life: 20+Math.random()*15 });
            if (topFloor > highScore) { highScore = topFloor; localStorage.setItem('gb_runner_highscore', highScore); }
        }

        function showGameOverMenu() {
            gameState = 'GAMEOVER'; gameOverTime = performance.now();
            menuTitle.innerText = "GAME OVER"; menuScore.innerText = `Floor Reached: ${topFloor}`; menuHighscore.innerText = `High Score: ${highScore}`;
            menuInstruction.innerText = "[TAP] to Retry"; menuInstruction.style.opacity = "0";
            setTimeout(() => { if (gameState === 'GAMEOVER') menuInstruction.style.opacity = "1"; }, 1000);
            menuScreen.classList.add('visible');
        }

        function initGame() {
            wMarioX = 20 << 8; wMarioY = 0 << 8; wMarioVX = 0; wMarioVY = 0; wMarioState = STATE_FALL; wMarioFacing = 0;      
            autoDirection = 1; topFloor = 0; currentFloor = 0; backflipStartFloor = 0; cameraY = -196; targetCameraY = -196; frameCount = 0;
            cameraX = 20 - 22; activeEntities = []; spawnedChunks.clear(); floorCliffs = {}; globalSeed = Math.floor(Math.random() * 1000000);
            particles = []; ghosts = []; cameraShake = 0; flashTimer = 0; globalTimeScale = 1.0; visualRotation = 0;
            
            chunkCache.clear();
            chunkQueue = [];
            queuedChunks.clear();
            
            // PRE-GENERATION: Blocks for < 10ms to ensure absolutely 0 hitching on the first jump
            for (let f = 0; f <= 8; f++) {
                for (let cx = -4; cx <= 4; cx++) {
                    getCachedChunk(cx, f);
                    spawnEntitiesForChunk(cx, f);
                }
            }

            // Initialization for rendering interpolator 
            prevWMarioX = wMarioX; prevWMarioY = wMarioY;
            prevCameraX = cameraX; prevCameraY = cameraY;
            prevVisualRotation = 0;
            prevDeathAnimationX = 0; prevDeathAnimationY = 0;
            
            registerFloorLanding(0, 20, 1); scoreDisplay.innerText = "0"; menuScreen.classList.remove('visible');
        }

        function gbUpdate() {
            // ==========================================
            // PREVIOUS STATE CAPTURE FOR INTERPOLATION
            // ==========================================
            prevWMarioX = wMarioX; prevWMarioY = wMarioY;
            prevCameraX = cameraX; prevCameraY = cameraY;
            prevVisualRotation = visualRotation;
            prevDeathAnimationX = deathAnimationX; 
            prevDeathAnimationY = deathAnimationY;
            for (let ent of activeEntities) { ent.prevX = ent.x; ent.prevY = ent.y; }
            for (let p of particles) { p.prevX = p.x; p.prevY = p.y; }
            
            frameCount++;
            let isJumpAction = input.rawJump || input.discreteJump;
            let isFlipAction = input.discreteFlip;
            let menuAction = isJumpAction || input.menuTap;
            input.discreteJump = false; input.discreteFlip = false; input.menuTap = false; 

            if (gameState === 'START') {
                if (menuAction && !lastMenuAction) { initGame(); gameState = 'PLAYING'; }
                lastMenuAction = menuAction; return;
            }
            if (gameState === 'DYING') {
                deathAnimationY += deathAnimationVY; deathAnimationVY += 0.2;
                if (cameraShake > 0) cameraShake--;
                for (let i = particles.length - 1; i >= 0; i--) { particles[i].x += particles[i].vx; particles[i].y += particles[i].vy; particles[i].life--; if (particles[i].life <= 0) particles.splice(i, 1); }
                if (deathAnimationY > cameraY + 300) showGameOverMenu();
                return;
            }
            if (gameState === 'GAMEOVER') {
                if (performance.now() - gameOverTime < 1000) { lastMenuAction = menuAction; return; }
                if (menuAction && !lastMenuAction) { initGame(); gameState = 'PLAYING'; }
                lastMenuAction = menuAction; return;
            }
            lastMenuAction = menuAction;

            hJoypadDown = isJumpAction ? PAD_A : 0;
            hJoypadPressed = (lastJoypadDown ^ hJoypadDown) & hJoypadDown;
            lastJoypadDown = hJoypadDown;

            switch(wMarioState) {
                case STATE_STAND: wMarioVX = 0; wMarioState = STATE_WALK; break;
                case STATE_WALK:
                    if (isFlipAction) { 
                        wMarioVY = BACKFLIP_FORCE; autoDirection *= -1; wMarioFacing = (autoDirection === 1) ? 0 : 1; 
                        wMarioVX = (wMarioFacing === 1) ? ((~MAX_WALK_SPEED + 1) & 0xFFFF) : MAX_WALK_SPEED; 
                        wMarioState = STATE_BACKFLIP; backflipStartFloor = Math.max(0, Math.floor(-Math.floor(wMarioY / 256) / FLOOR_SPACING)); 
                        targetCameraY = - ((backflipStartFloor + 1) * FLOOR_SPACING) - 196; break; 
                    }
                    wMarioVX = addQ88(wMarioVX, (autoDirection === 1) ? WALK_ACCEL : (~WALK_ACCEL + 1) & 0xFFFF);
                    if (!(wMarioVX & 0x8000) && wMarioVX > MAX_WALK_SPEED) wMarioVX = MAX_WALK_SPEED; if ((wMarioVX & 0x8000) && wMarioVX < ((~MAX_WALK_SPEED + 1) & 0xFFFF)) wMarioVX = (~MAX_WALK_SPEED + 1) & 0xFFFF;
                    wMarioFacing = (autoDirection === 1) ? 0 : 1;
                    if (hJoypadPressed & PAD_A) { wMarioVY = JUMP_FORCE; wMarioState = STATE_JUMP; }
                    break;
                case STATE_JUMP: case STATE_BACKFLIP: case STATE_FALL:
                    wMarioVX = addQ88(wMarioVX, (autoDirection === 1) ? (WALK_ACCEL >> 1) : (~(WALK_ACCEL >> 1) + 1) & 0xFFFF);
                    if (!(wMarioVX & 0x8000) && wMarioVX > MAX_WALK_SPEED) wMarioVX = MAX_WALK_SPEED; if ((wMarioVX & 0x8000) && wMarioVX < ((~MAX_WALK_SPEED + 1) & 0xFFFF)) wMarioVX = (~MAX_WALK_SPEED + 1) & 0xFFFF;
                    if (!(wMarioVY & 0x8000) && wMarioState !== STATE_BACKFLIP) wMarioState = STATE_FALL; break;
            }

            wMarioVY = addQ88(wMarioVY, GRAVITY_ORIGINAL);
            if (!(wMarioVY & 0x8000) && wMarioVY > TERM_VELOCITY) wMarioVY = TERM_VELOCITY;

            let px = Math.floor(wMarioX / 256), py = Math.floor(wMarioY / 256);
            let inAir = (wMarioState === STATE_JUMP || wMarioState === STATE_BACKFLIP || wMarioState === STATE_FALL);
            
            // IMMINENT LANDING SLOW-MO LOGIC (Activates strictly during the descent arc toward a new high floor)
            let floorBelowN = Math.floor((-py + 24) / FLOOR_SPACING);
            let floorBelowY = -floorBelowN * FLOOR_SPACING;
            let distToFloor = floorBelowY - py;
            let landingPending = (floorBelowN > topFloor && distToFloor > 0 && (getSolidType(px - 4, floorBelowY) || getSolidType(px + 3, floorBelowY)));

            if (landingPending && inAir && wMarioVY > 0) {
                globalTimeScale = Math.max(0.6, globalTimeScale * 0.94);
            } else {
                globalTimeScale = globalTimeScale + (1.0 - globalTimeScale) * 0.15;
            }

            // Update visual rotation for backflip and landing smoothing
            if (wMarioState === STATE_BACKFLIP) {
                visualRotation = (py * 0.1) * ((wMarioFacing === 1) ? 1 : -1);
            } else {
                // Instantly wrap rotation to the primary circle to prevent lerping through multiple backwards spins
                if (Math.abs(visualRotation) > Math.PI) {
                    let offset = visualRotation - Math.atan2(Math.sin(visualRotation), Math.cos(visualRotation));
                    visualRotation -= offset;
                    prevVisualRotation -= offset; 
                }
                visualRotation *= 0.8; // Smoothly return to flat 0
                if (Math.abs(visualRotation) < 0.01) visualRotation = 0;
            }

            wMarioY = addQ88(wMarioY, wMarioVY);
            px = Math.floor(wMarioX / 256); py = Math.floor(wMarioY / 256);
            
            if (!(wMarioVY & 0x8000) && (getSolidType(px - 4, py) !== 0 || getSolidType(px + 3, py) !== 0)) {
                wMarioY = (Math.floor(py / 8) * 8) * 256; wMarioVY = 0;
                let landedFloor = Math.max(0, Math.floor(-Math.floor(wMarioY / 256) / FLOOR_SPACING));
                if (wMarioState === STATE_BACKFLIP && landedFloor <= backflipStartFloor) triggerGameOver();
                else {
                    if (landedFloor > topFloor) {
                        topFloor = landedFloor; cameraShake = 8; flashTimer = 8;
                        scoreDisplay.classList.add('pop'); setTimeout(() => scoreDisplay.classList.remove('pop'), 150);
                        for (let i = 0; i < 6; i++) particles.push({ x: px + (wMarioFacing === 1 ? -2 : 2), y: py, prevX: px + (wMarioFacing === 1 ? -2 : 2), prevY: py, vx: (Math.random()-0.5)*3, vy: (Math.random()*-1.5)-0.5, life: 15+Math.random()*10 });
                    }
                    wMarioState = STATE_WALK; registerFloorLanding(landedFloor, px, autoDirection); 
                    globalTimeScale = 1.0; // Instantly snap back to 100% speed on impact
                }
            } else { if (wMarioState === STATE_WALK) wMarioState = STATE_FALL; if (inAir && getSolidType(px, py - 7) !== 0) triggerGameOver(); }

            wMarioX = addQ88(wMarioX, wMarioVX); px = Math.floor(wMarioX / 256); py = Math.floor(wMarioY / 256);
            if (inAir && getSolidType(px, py - 7) !== 0) triggerGameOver();
            else if (!inAir) {
                if (wMarioVX > 0 && getSolidType(px + 4, py - 1) !== 0) { wMarioX = (Math.floor((px + 4) / 8) * 8 - 5) * 256; wMarioVX = 0; }
                else if (wMarioVX < 0 && getSolidType(px - 5, py - 1) !== 0) { wMarioX = (Math.floor((px - 5) / 8) * 8 + 13) * 256; wMarioVX = 0; }
            }

            currentFloor = Math.max(0, Math.floor(-py / FLOOR_SPACING));
            let chunkX = Math.floor(px / CHUNK_WIDTH);
            
            // Queue upcoming chunks for generation instead of blocking the main thread
            for (let f = currentFloor; f <= currentFloor + 8; f++) {
                for (let cx = chunkX - 3; cx <= chunkX + 3; cx++) {
                    queueChunkGeneration(cx, f);
                }
            }
            
            for (let i = activeEntities.length - 1; i >= 0; i--) {
                let ent = activeEntities[i];
                if (ent.y > cameraY + 300) { activeEntities.splice(i, 1); continue; }
                let speedMultiplier = (Math.sign(ent.vx) !== Math.sign(autoDirection)) ? 0.5 : 1.0;
                if (ent.type === 'PATROL') { ent.x += ent.vx * speedMultiplier; if (getSolidType(ent.x + (ent.vx > 0 ? 8 : -1), ent.y) === 0 || getSolidType(ent.x + (ent.vx > 0 ? 8 : -1), ent.y - 4) !== 0) ent.vx *= -1; }
                else if (ent.type === 'CANNON') { if (++ent.timer > ent.fireRate) { ent.timer = 0; activeEntities.push({ type: 'BULLET', x: ent.x + (ent.dirX > 0 ? 8 : -4), y: ent.y - 4, prevX: ent.x + (ent.dirX > 0 ? 8 : -4), prevY: ent.y - 4, vx: ent.dirX * ent.bulletSpeed, timer: 0 }); } }
                else if (ent.type === 'BULLET') { ent.x += ent.vx; if (ent.timer++ > 300) activeEntities.splice(i, 1); }
                else if (ent.type === 'BOUNCER') { ent.x += ent.vx * speedMultiplier; ent.y += ent.vy; if (getSolidType(ent.x + (ent.vx > 0 ? 8 : -1), ent.y - 4) !== 0) ent.vx *= -1; if (ent.vy > 0 && getSolidType(ent.x + 4, ent.y + 1) !== 0) { ent.vy *= -1; ent.y = Math.floor(ent.y / 8) * 8; } if (ent.vy < 0 && (getSolidType(ent.x + 4, ent.y - 8) !== 0 || ent.y < ent.baseFloorY - 40)) ent.vy *= -1; }
                else if (ent.type === 'WAVER') { ent.timer++; ent.x += ent.vx * speedMultiplier; ent.y = ent.startY + Math.sin(ent.timer * 0.05) * 20; if (getSolidType(ent.x + (ent.vx > 0 ? 8 : -1), ent.y) !== 0) ent.vx *= -1; }
                let ex = Math.floor(ent.x), ey = Math.floor(ent.y), dotY = py - 7, hit = false;
                if (ent.type === 'BULLET') { if (px >= ex && px <= ex + 4 && dotY >= ey - 4 && dotY <= ey) hit = true; } else if (px >= ex && px <= ex + 8 && dotY >= ey - 8 && dotY <= ey) hit = true;
                if (hit && gameState === 'PLAYING') triggerGameOver();
            }

            for (let i = particles.length - 1; i >= 0; i--) { particles[i].x += particles[i].vx; particles[i].y += particles[i].vy; particles[i].life--; if (particles[i].life <= 0) particles.splice(i, 1); }
            if (wMarioState === STATE_BACKFLIP && frameCount % 3 === 0) ghosts.push({ x: px, y: py, facing: wMarioFacing, rot: visualRotation, life: 12, maxLife: 12 });
            for (let i = ghosts.length - 1; i >= 0; i--) { ghosts[i].life--; if (ghosts[i].life <= 0) ghosts.splice(i, 1); }

            if (cameraShake > 0) cameraShake--;
            if (flashTimer > 0) flashTimer--;
            let targetCameraX = (autoDirection === 1) ? px - 22 : px - 122;
            cameraX += (targetCameraX - cameraX) * 0.08; 
            cameraY += (targetCameraY - cameraY) * 0.1; 
            if (py > cameraY + 256 && gameState === 'PLAYING') triggerGameOver();
        }

        // Rendering logic decoupled with alpha for sub-frame perfect visuals without hitching
        function draw(alpha) {
            ctx.fillStyle = PALETTE.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
            let shakeOffset = cameraShake > 0 ? ((frameCount % 2 === 0) ? 2 : -2) : 0;
            
            // Interpolate camera
            let lerpCameraX = prevCameraX + (cameraX - prevCameraX) * alpha;
            let lerpCameraY = prevCameraY + (cameraY - prevCameraY) * alpha;
            let camX = Math.round(lerpCameraX);
            let camY = Math.round(lerpCameraY);
            
            ctx.save(); ctx.translate(-camX, -(camY + shakeOffset));
            
            let bottomVisibleFloor = Math.max(0, Math.floor((-camY - 256) / FLOOR_SPACING) - 1);
            let topVisibleFloor = Math.floor((-camY + 300) / FLOOR_SPACING) + 1;
            
            // Rendering chunk checks expanded to match physics limits completely avoiding visual popping
            for (let f = bottomVisibleFloor; f <= topVisibleFloor; f++) {
                let floorY = -f * FLOOR_SPACING, leftX = camX - 32, rightX = camX + 144 + 32;
                let startChunk = Math.floor(leftX / CHUNK_WIDTH) - 2, endChunk = Math.floor(rightX / CHUNK_WIDTH) + 2;
                let cliff = floorCliffs[f], cliffLeft = -Infinity, cliffRight = Infinity;
                if (cliff) { if (cliff.dir === 1) cliffRight = cliff.x; else cliffLeft = cliff.x; }
                let allHoles = [];
                let frameTime = frameCount + alpha; // Use fractional time for perfectly smooth mechanics
                for (let cx = startChunk; cx <= endChunk; cx++) {
                    if (chunkCache.has(cx + ',' + f)) allHoles.push(...getDynamicHoles(cx, f, frameTime));
                }
                allHoles.sort((a,b) => a.x - b.x);
                let curX = Math.max(leftX, cliffLeft), maxRight = Math.min(rightX, cliffRight), solidSegments = [];
                for (let hole of allHoles) { if (hole.x > curX) solidSegments.push([curX, Math.min(hole.x, maxRight)]); curX = Math.max(curX, hole.x + hole.w); }
                if (curX < maxRight) solidSegments.push([curX, maxRight]);
                for (let seg of solidSegments) {
                    if (seg[1] > seg[0]) {
                        let segX = Math.round(seg[0]), segW = Math.round(seg[1] - seg[0]);
                        let isFlashing = (f === topFloor && flashTimer > 0);
                        ctx.fillStyle = isFlashing ? PALETTE.light : PALETTE.dark; ctx.fillRect(segX, floorY, segW, f === 0 ? 300 : 8);
                        ctx.fillStyle = isFlashing ? PALETTE.bg : PALETTE.light; ctx.fillRect(segX, floorY, segW, 1);
                        for (let hole of allHoles) {
                            if (hole.type === 1 || hole.type === 2) {
                                let overlapStart = Math.max(segX, hole.minBound), overlapEnd = Math.min(segX + segW, hole.maxBound);
                                if (overlapStart < overlapEnd) {
                                    ctx.fillStyle = PALETTE.black; ctx.fillRect(Math.floor(overlapStart), floorY + 4, Math.ceil(overlapEnd - overlapStart), 2);
                                    ctx.fillStyle = isFlashing ? PALETTE.bg : PALETTE.light;
                                    for (let dx = Math.floor(overlapStart); dx < overlapEnd; dx++) if (Math.abs(dx) % 8 < 4) ctx.fillRect(dx, floorY + 4, 1, 2);
                                }
                            }
                        }
                    }
                }
            }

            for (let ent of activeEntities) {
                let lerpX = ent.prevX + (ent.x - ent.prevX) * alpha;
                let lerpY = ent.prevY + (ent.y - ent.prevY) * alpha;
                let ex = Math.round(lerpX), ey = Math.round(lerpY);
                if (ent.type === 'SPIKE') { ctx.fillStyle = PALETTE.black; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex + 4, ey - 8); ctx.lineTo(ex + 8, ey); ctx.fill(); }
                else if (ent.type === 'PATROL') { ctx.fillStyle = PALETTE.dark; ctx.fillRect(ex, ey - 8, 8, 8); ctx.fillStyle = PALETTE.bg; ctx.fillRect(ex + (ent.vx > 0 ? 5 : 1), ey - 6, 2, 2); }
                else if (ent.type === 'CANNON') { ctx.fillStyle = PALETTE.black; ctx.fillRect(ex, ey - 8, 8, 8); ctx.fillStyle = PALETTE.dark; ctx.fillRect(ex + (ent.dirX > 0 ? 8 : -4), ey - 6, 4, 4); }
                else if (ent.type === 'BULLET') { ctx.fillStyle = PALETTE.black; ctx.beginPath(); ctx.arc(ex + 2, ey - 2, 2, 0, Math.PI * 2); ctx.fill(); }
                else if (ent.type === 'BOUNCER') { ctx.fillStyle = PALETTE.dark; ctx.beginPath(); ctx.arc(ex + 4, ey - 4, 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = PALETTE.bg; ctx.fillRect(ex + (ent.vx > 0 ? 5 : 1), ey - 5, 2, 2); }
                else if (ent.type === 'WAVER') { ctx.fillStyle = PALETTE.black; ctx.fillRect(ex, ey - 6, 8, 4); ctx.fillStyle = PALETTE.dark; ctx.fillRect(ex + 2, ey - 8, 4, 8); ctx.fillStyle = PALETTE.bg; ctx.fillRect(ex + (ent.vx > 0 ? 6 : 0), ey - 5, 2, 2); }
            }
            
            for (let g of ghosts) { ctx.save(); ctx.translate(Math.round(g.x), Math.round(g.y) - 7); ctx.rotate(g.rot); ctx.scale((g.facing === 1) ? -1 : 1, 1); ctx.globalAlpha = (g.life / g.maxLife) * 0.45; ctx.fillStyle = PALETTE.dark; ctx.fillRect(-5, -7, 10, 14); ctx.restore(); }
            
            if (gameState === 'DYING') { 
                let lerpDx = prevDeathAnimationX + (deathAnimationX - prevDeathAnimationX) * alpha;
                let lerpDy = prevDeathAnimationY + (deathAnimationY - prevDeathAnimationY) * alpha;
                ctx.save(); ctx.translate(Math.round(lerpDx), Math.round(lerpDy)); ctx.rotate((frameCount + alpha) * 0.1); ctx.fillStyle = PALETTE.black; ctx.fillRect(-5, -7, 10, 14); ctx.fillStyle = PALETTE.bg; ctx.fillRect(-1, -5, 6, 4); ctx.restore(); 
            }
            else if (gameState === 'PLAYING') {
                let lerpPx = (prevWMarioX + (wMarioX - prevWMarioX) * alpha) / 256;
                let lerpPy = (prevWMarioY + (wMarioY - prevWMarioY) * alpha) / 256;
                let drawPx = Math.round(lerpPx);
                let drawPy = Math.round(lerpPy);
                let lerpRot = prevVisualRotation + (visualRotation - prevVisualRotation) * alpha;
                ctx.save(); ctx.translate(drawPx, drawPy - 7); ctx.rotate(lerpRot); ctx.scale((wMarioFacing === 1) ? -1 : 1, 1);
                ctx.fillStyle = PALETTE.black; ctx.fillRect(-5, -7, 10, 14); ctx.fillStyle = PALETTE.bg; ctx.fillRect(-1, -5, 6, 4); ctx.restore();
            }
            
            ctx.fillStyle = PALETTE.dark; 
            for (let p of particles) {
                let px = Math.round(p.prevX + (p.x - p.prevX) * alpha);
                let py = Math.round(p.prevY + (p.y - p.prevY) * alpha);
                ctx.fillRect(px, py, 2, 2);
            }
            
            ctx.restore();
            if (gameState === 'PLAYING') { scoreDisplay.innerText = topFloor; scoreDisplay.style.display = 'block'; } else scoreDisplay.style.display = 'none';
        }

        const GB_STEP = 1000 / 60; 
        let lastTime = 0, accumulator = 0;
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = timestamp - lastTime; 
            lastTime = timestamp;
            
            // Process async chunk generation queue (Time-sliced to 2ms max to prevent stutter)
            let qStart = performance.now();
            while (chunkQueue.length > 0 && performance.now() - qStart < 2) {
                let task = chunkQueue.shift();
                queuedChunks.delete(task.key); 
                getCachedChunk(task.cx, task.f);
                spawnEntitiesForChunk(task.cx, task.f);
            }

            // Allow physics loop to digest time normally based on pure delta
            accumulator += Math.min(dt, 250) * globalTimeScale;
            while (accumulator >= GB_STEP) { 
                gbUpdate(); 
                accumulator -= GB_STEP; 
            }
            
            // Calculate strictly pure render interpolation to untether visual hz from physics hz
            let alpha = accumulator / GB_STEP;
            draw(alpha); 
            
            requestAnimationFrame(gameLoop);
        }
        menuInstruction.style.opacity = "1"; menuScreen.classList.add('visible'); requestAnimationFrame(gameLoop);
    </script>
</body>
