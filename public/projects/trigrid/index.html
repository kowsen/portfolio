                grid[gf.r][gf.c].type = originalType;
              } else {
                // Ghost position is out of bounds, just draw with color override
                drawTriangle(gf.r, gf.c, { x: vx, y: vy }, color);
              }
            }
            if (ghostBackward[i]) {
              const gb = ghostBackward[i];
              // Check if ghost position is within bounds
              if (grid[gb.r] && grid[gb.r][gb.c]) {
                // Temporarily set the ghost position's type to match the original cell
                const originalType = grid[gb.r][gb.c].type;
                grid[gb.r][gb.c].type = cellType;
                drawTriangle(gb.r, gb.c, { x: vx, y: vy }, color);
                grid[gb.r][gb.c].type = originalType;
              } else {
                // Ghost position is out of bounds, just draw with color override
                drawTriangle(gb.r, gb.c, { x: vx, y: vy }, color);
              }
            }
          });
        }

        if (predictedMatches.length > 0) {
          drawContour(predictedMatches);
        }

        // Draw Bomb Effects (Optimized for mobile performance)
        // Limit concurrent effects to prevent slowdown during long chain reactions
        const MAX_CONCURRENT_EFFECTS = 3;
        if (bombEffects.length > MAX_CONCURRENT_EFFECTS) {
          bombEffects = bombEffects.slice(-MAX_CONCURRENT_EFFECTS);
        }

        bombEffects = bombEffects.filter((effect) => {
          const elapsed = time - effect.startTime;
          if (elapsed > effect.duration) return false;

          const t = elapsed / effect.duration;
          const alpha = Math.max(0, 1 - t);

          // Determine visual angle based on axis
          let angle = 0; // 'horiz' is visual vertical (0 in logical coord system but beam needs to be along X axis? No, along row)
          // Wait, row 'r' is constant. 'horiz' means all columns.
          // Grid rotated 90deg CW.
          // R axis -> Y (Down?) No. R is index of Row.
          // Let's use getTriangleCenter to determine start/end points of beam.

          let startX, startY, endX, endY;

          if (effect.axis === "horiz") {
            // Entire Row r
            const start = getTriangleCenter(effect.r, 0);
            const end = getTriangleCenter(effect.r, COLS - 1);
            startX = start.x - TRIANGLE_WIDTH;
            startY = start.y;
            endX = end.x + TRIANGLE_WIDTH;
            endY = end.y;
          } else if (effect.axis === "diagA") {
            // K = ceil((c-r)/2)
            // Get random cell in strip to find k
            const k = Math.ceil((effect.c - effect.r) / 2);
            // Find endpoints within grid
            let minC = -1,
              maxC = -1,
              minR = -1,
              maxR = -1;

            // Simple scan for bounds
            for (let r = 0; r < ROWS; r++) {
              for (let c = 0; c < COLS; c++) {
                if (Math.ceil((c - r) / 2) === k) {
                  if (minC === -1) {
                    minC = c;
                    minR = r;
                  }
                  maxC = c;
                  maxR = r;
                }
              }
            }
            const start = getTriangleCenter(minR, minC);
            const end = getTriangleCenter(maxR, maxC);
            // Extend visual
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            const len = Math.sqrt(dx * dx + dy * dy);
            const normX = dx / len;
            const normY = dy / len;

            startX = start.x - normX * TRIANGLE_WIDTH;
            startY = start.y - normY * TRIANGLE_WIDTH;
            endX = end.x + normX * TRIANGLE_WIDTH;
            endY = end.y + normY * TRIANGLE_WIDTH;
          } else {
            // diagB
            const k = Math.floor((effect.c + effect.r) / 2);
            let minC = -1,
              maxC = -1,
              minR = -1,
              maxR = -1;
            for (let r = 0; r < ROWS; r++) {
              for (let c = 0; c < COLS; c++) {
                if (Math.floor((c + r) / 2) === k) {
                  if (minC === -1) {
                    minC = c;
                    minR = r;
                  }
                  maxC = c;
                  maxR = r;
                }
              }
            }
            const start = getTriangleCenter(minR, minC);
            const end = getTriangleCenter(maxR, maxC);
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            const len = Math.sqrt(dx * dx + dy * dy);
            const normX = dx / len;
            const normY = dy / len;

            startX = start.x - normX * TRIANGLE_WIDTH;
            startY = start.y - normY * TRIANGLE_WIDTH;
            endX = end.x + normX * TRIANGLE_WIDTH;
            endY = end.y + normY * TRIANGLE_WIDTH;
          }

          ctx.save();
          ctx.globalCompositeOperation = "screen";

          // Draw beam from start to end
          // Create gradient along line
          const gradient = ctx.createLinearGradient(startX, startY, endX, endY);
          gradient.addColorStop(0, `rgba(255, 255, 255, 0)`);
          gradient.addColorStop(0.5, `rgba(255, 255, 255, ${alpha * 0.8})`);
          gradient.addColorStop(1, `rgba(255, 255, 255, 0)`);

          ctx.strokeStyle = gradient;
          ctx.lineWidth = TRIANGLE_HEIGHT;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(endX, endY);
          ctx.stroke();

          // Core Brightness
          ctx.strokeStyle = `rgba(255, 255, 200, ${alpha * 0.5})`;
          ctx.lineWidth = TRIANGLE_HEIGHT * 0.5;
          ctx.stroke();

          ctx.restore();

          return true;
        });

        // Draw Flower Effects
        flowerEffects = flowerEffects.filter((effect) => {
          const elapsed = time - effect.startTime;
          if (elapsed > effect.duration) return false;

          const t = elapsed / effect.duration;
          const alpha = Math.max(0, 1 - t);
          const pulse = 1 + Math.sin(t * Math.PI * 4) * 0.2; // Quick pulse

          ctx.save();
          ctx.globalCompositeOperation = "screen";

          if (effect.affectedCells) {
            effect.affectedCells.forEach((cell) => {
              const center = getTriangleCenter(cell.r, cell.c);
              const up = isPointingUp(cell.r, cell.c);

              // Pulse Scale per cell for organic feel
              const distFromCenter = Math.sqrt(
                Math.pow(cell.r - effect.r, 2) + Math.pow(cell.c - effect.c, 2)
              );
              const delay = distFromCenter * 0.1;
              const localT = Math.max(0, Math.min(1, (t - delay) * 1.5));

              if (localT > 0 && localT < 1) {
                const localAlpha = Math.sin(localT * Math.PI);

                ctx.beginPath();
                drawTriangleShape(
                  ctx,
                  cell.r,
                  cell.c,
                  center.x,
                  center.y,
                  TRIANGLE_WIDTH, // Removed 1.2 scale to fit inside
                  TRIANGLE_HEIGHT, // Removed 1.2 scale to fit inside
                  up,
                  0 // Removed padding to fit inside
                );
                ctx.fillStyle = `rgba(255, 215, 0, ${localAlpha * 0.6})`;
                ctx.fill();

                // Highlight Stroke
                ctx.strokeStyle = `rgba(255, 255, 255, ${localAlpha * 0.9})`;
                ctx.lineWidth = 3;
                ctx.stroke();
              }
            });
          }

          ctx.restore();
          return true;
        });

        ctx.restore();

        requestAnimationFrame(render);
      }

      initGame();
      requestAnimationFrame(render);
    </script>
  </body>
