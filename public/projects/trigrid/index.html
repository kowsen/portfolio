  <body>
    <div id="fps-locker"></div>

      </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
      /**
       * TRIANGULAR MATCH-3
       * ==================
       * * GAME MECHANICS:
       * ----------------
       * 1. GRID STRUCTURE:
       * - The game uses a triangular grid.
       * - Orientation: The game is rendered rotated 90 degrees clockwise.
       * - Logical X+ axis corresponds to Visual Down (Gravity direction).
       * - Logical Y+ axis corresponds to Visual Left.
       * - Dimensions: 11 Logical Columns x 4 Logical Rows.
       * * 2. MATCHING:
       * - Matches are formed by 3 or more adjacent triangles of the same color.
       * - Matches must be contiguous.
       * * 3. POWERUPS:
       * - BOMB (Created on Line of 4+ Same Color):
       * - Visual: Dark grey circle with a directional fuse/line.
       * - Effect: Destroys the entire line (row or diagonal) matching its creation axis.
       * - WIPE (Created on match size 7+):
       * - Visual: Dark grey double-circle with radiating lines.
       * - Effect: Destroys ALL tiles of the matching color on the board.
       * - FLOWER (Created when 2+ matches of diff colors are adjacent):
       * - Visual: Dark grey circle with petals.
       * - Effect: Destroys all tiles within 2 steps of adjacency.
       * * 4. GRAVITY:
       * - Gravity pulls tiles "Down" relative to the screen.
       * - In Logical coordinates, this is the Positive X direction.
       * - Gravity resolves per-strip, allowing triangles to swap orientation (Up <-> Down) to fill gaps.
       * * 5. INPUT:
       * - Dragging is supported along 3 axes:
       * - Horizontal (Logical Row)
       * - Diagonal A
       * - Diagonal B
       * - The game predicts matches and shows a "Contour" highlight.
       * * CODE STRUCTURE & IMPORTANT NOTES:
       * ---------------------------------
       * 1. COORDINATE SYSTEM:
       * - `getLogicalPos(evt)`: Transforms screen coordinates (Mouse/Touch) to Logical Grid coordinates.
       * - `getTriangleCenter(r, c)`: Transforms Logical Grid coordinates to Screen coordinates for rendering.
       * * 2. PHYSICS LOOP:
       * - `applyGravity()`: Handles the falling logic. It searches "up" (Logical X-) for source tiles.
       * - `updateFallingPhysics()`: Handles the smooth animation of falling tiles using `animDist` and `animVel`.
       * * 3. RENDERING:
       * - `render()`: The main game loop. This MUST be framerate independent (using delta time).
       * - The context is rotated 90 degrees to align Logical X with Visual Down.
       * - `drawTriangle()`: Handles drawing individual tiles, including ghosts, spawning animations, and powerup icons.
       * * 4. PERFORMANCE:
       * - `desynchronized: true`: Used in `getContext` to reduce input latency on mobile.
       * - "Dummy Ticker": An invisible CSS animation (`#fps-locker`) forces the browser to maintain high refresh rates (60/120fps) even when idle.
       * */

      const DEBUG = false;

      const canvas = document.getElementById("gameCanvas");

      /** * PERFORMANCE FIX: Context Attributes
       * 1. alpha: false -> Tells browser the canvas is opaque, optimizing compositing.
       * 2. desynchronized: true -> Crucial for mobile. Hints to bypass the standard
       * compositor queue to reduce latency and decouple from main thread throttling.
       */
      const ctx = canvas.getContext("2d", {
        alpha: false,
        desynchronized: true,
      });

      const scoreEl = document.getElementById("score-display");
      const movesEl = document.getElementById("moves-display");
      const comboEl = document.getElementById("combo-display");
      const modalEl = document.getElementById("modal-overlay");
      const finalScoreEl = document.getElementById("final-score");
      const highScoreEl = document.getElementById("high-score-display");
      const fpsEl = document.getElementById("fps-display");

      if (!DEBUG) {
        fpsEl.style.display = "none";
      }

      // --- Configuration ---
      const PADDING = 16;
      const ASPECT_RATIO = 52 / 60;

      const GRAVITY_ACCEL = 0.25;
      const BOUNCE_DAMPING = 0.35;
      const REVERT_STIFFNESS = 0.2;

      // TIMESTEP CONFIGURATION
      const TARGET_FPS = 120;
      const TARGET_MS_PER_FRAME = 1000 / TARGET_FPS;

      // Fixed Grid Dimensions
      let ROWS = 8;
      let COLS = 7;
      let TRIANGLE_WIDTH = 0; // Calculated dynamically
      let TRIANGLE_HEIGHT = 0;

      const PALETTE = [
        "#ef4444", // Ruby Red
        "#eab308", // Lemon Yellow
        "#84cc16", // Lime Green
        "#06b6d4", // Cyan
        "#8b5cf6", // Purple
      ];

      // State
      let grid = [];
      let offsetX = 0;
      let offsetY = 0;
      let score = 0;
      let scoreMultiplier = 1;
      let time = 0;
      let lastTime = 0; // For Delta Time

      // FPS Variables
      let lastFpsTime = 0;
      let frameCount = 0;

      let movesLeft = 12;
      let isGameOver = false;
      let comboTimeout = null;

      let isProcessingMatches = false;
      let isFalling = false;
      let checkQueue = [];
      let predictedMatches = [];
      let invalidMoveTime = -1;
      let bombEffects = []; // { r: number, c: number, axis: string, startTime: number, duration: number }
      let flowerEffects = []; // { r: number, c: number, affectedCells: [], startTime: number, duration: number }

      let axisConfig = {
        horiz: { x: 1, y: 0, step: 0 },
        diagA: { x: 0, y: 0, step: 0 },
        diagB: { x: 0, y: 0, step: 0 },
      };

      // Default Gravity: Screen Down (Logical Horizontal +1)
      // Since we rotated 90deg CW, Logical X+ is Visual Y+ (Down).
      let activeGravity = {
        axis: "horiz",
        dir: 1,
      };

      let drag = {
        active: false,
        start: { x: 0, y: 0 },
        current: { x: 0, y: 0 },
        originCell: null,
        lockedAxis: null,
        strip: [],
        pixelOffset: 0,
        velocity: 0,
        lastProjection: 0,
        isAnimating: false,
        dataShift: 1,
        netDragShift: 0,
        isReverting: false,
      };

      const isPointingUp = (r, c) => (r + c) % 2 === 0;

      function createCell(color) {
        return {
          color: color,
          ghostColor: null,
          animDist: 0,
          initialAnimDist: 0, // Track the total fall distance for animation logic
          animVel: 0,
          popStartTime: 0,
          spawnTime: 0,
          type: "normal", // normal, bomb, wipe, flower
          bombAxis: null, // horiz, diagA, diagB (for bomb type)
        };
      }

      function calculateDimensions() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;

        const availableW = canvas.width - PADDING * 2;
        const availableH = canvas.height - PADDING * 2;

        // Enforce Fixed Grid
        // Visual Width (Logical Rows) = 4 widths => ROWS = 5 (approx 4.33 widths)
        // Visual Height (Logical Cols) = 8 widths (16 triangles) => COLS = 16
        // User requested one fewer row and col:
        COLS = 11;
        ROWS = 4;

        // ROTATION LOGIC:
        // The grid is rendered rotated 90 degrees.
        // Logical Width (Cols) must fit in Physical Height.
        // Logical Height (Rows) must fit in Physical Width.

        // 1. Scale based on Logical Width (fitting into Physical Height)
        // Grid Width Formula: (COLS + 1) * Width / 2
        // Solve for Width: Width <= (2 * AvailableH) / (COLS + 1)
        const maxW_by_width = (2 * availableH) / (COLS + 1);

        // 2. Scale based on Logical Height (fitting into Physical Width)
        // Grid Height Formula: ROWS * Height => ROWS * (Width * Aspect)
        // Solve for Width: Width <= AvailableW / (ROWS * Aspect)
        const maxW_by_height = availableW / (ROWS * ASPECT_RATIO);

        // Use the smaller of the two to ensure it fits
        TRIANGLE_WIDTH = Math.min(maxW_by_width, maxW_by_height);
        TRIANGLE_HEIGHT = TRIANGLE_WIDTH * ASPECT_RATIO;

        axisConfig.horiz.step = TRIANGLE_WIDTH;
        const dx = TRIANGLE_WIDTH / 2;
        const dy = TRIANGLE_HEIGHT;
        const diagDist = Math.sqrt(dx * dx + dy * dy);

        const normX = dx / diagDist;
        const normY = dy / diagDist;

        axisConfig.diagA = { x: normX, y: normY, step: diagDist };
        axisConfig.diagB = { x: normX, y: -normY, step: diagDist };

        const gridWidth = ((COLS + 1) * TRIANGLE_WIDTH) / 2;
        const gridHeight = ROWS * TRIANGLE_HEIGHT;

        // Center the logical grid within the logical canvas (which has same dims as physical, just rotated space)
        // We want the center of the grid to align with center of canvas.
        // Center of canvas = (W/2, H/2).
        // Center of grid = (offsetX + GW/2, offsetY + GH/2).
        // We want these to match in the logical space.
        // Note: In render(), we rotate around (W/2, H/2).
        // So we just need to ensure the grid is centered relative to W and H.
        offsetX = (canvas.width - gridWidth) / 2;
        offsetY = (canvas.height - gridHeight) / 2;
      }

      function initGame() {
        calculateDimensions();
        score = 0;
        scoreEl.innerText = score;
        // Reduced to 12 for Grand Finale testing
        movesLeft = 12;
        movesEl.innerText = movesLeft;
        scoreMultiplier = 1; // Ensure multiplier resets
        lastTime = performance.now();

        grid = [];
        for (let r = 0; r < ROWS; r++) {
          let row = [];
          for (let c = 0; c < COLS; c++) {
            row.push(
              createCell(PALETTE[Math.floor(Math.random() * PALETTE.length)])
            );
          }
          grid.push(row);
        }
      }

      // New function to handle soft reset
      function resetGame() {
        modalEl.classList.remove("visible");
        isGameOver = false;

        // Reset physics/logic flags
        isProcessingMatches = false;
        isFalling = false;
        checkQueue = [];
        predictedMatches = [];

        // Reset Drag State
        drag = {
          active: false,
          start: { x: 0, y: 0 },
          current: { x: 0, y: 0 },
          originCell: null,
          lockedAxis: null,
          strip: [],
          pixelOffset: 0,
          velocity: 0,
          lastProjection: 0,
          isAnimating: false,
          dataShift: 1,
          netDragShift: 0,
          isReverting: false,
        };

        initGame();
      }

      function endGame() {
        if (isGameOver) return;
        isGameOver = true;

        const savedHigh = localStorage.getItem("triMatchHigh") || 0;
        let highScore = parseInt(savedHigh);
        if (score > highScore) {
          highScore = score;
          localStorage.setItem("triMatchHigh", highScore);
        }

        finalScoreEl.innerText = score;
        highScoreEl.innerText = `High Score: ${highScore}`;
        modalEl.classList.add("visible");
      }

      // --- GRAND FINALE LOGIC ---
      // Called when movesLeft == 0 to recursively detonate remaining powerups
      function processGrandFinale() {
        // 1. Scan for any powerups
        let powerups = [];
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (["bomb", "wipe", "flower"].includes(grid[r][c].type)) {
              powerups.push({ r, c });
            }
          }
        }

        if (powerups.length === 0) return false;

        // 2. Simulate matching effects for these powerups
        // Use the same recursive trigger logic as resolveMatches
        let matches = [...powerups];

        let processedPowerups = new Set();
        let powerupQueue = [...powerups];
        let head = 0;

        while (head < powerupQueue.length) {
          const p = powerupQueue[head++];
          const key = `${p.r},${p.c}`;
          if (processedPowerups.has(key)) continue;
          processedPowerups.add(key);

          const cell = grid[p.r][p.c];
          const type = cell.type;
          let newMatches = [];

          if (type === "bomb") {
            const axis = cell.bombAxis || "horiz";
            bombEffects.push({
              r: p.r,
              c: p.c,
              axis: axis,
              startTime: time,
              duration: 600,
            });
            // Collect cells in strip
            const strip = getStrip(p.r, p.c, axis);
            newMatches.push(...strip);
          } else if (type === "wipe") {
            const targetColor = cell.color;
            if (targetColor) {
              for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                  if (grid[r][c].color === targetColor) {
                    newMatches.push({ r, c });
                  }
                }
              }
            }
          } else if (type === "flower") {
            const neighbors = getExtendedNeighbors(p.r, p.c);
            flowerEffects.push({
              r: p.r,
              c: p.c,
              affectedCells: neighbors,
              startTime: time,
              duration: 600,
            });
            newMatches.push(...neighbors);
          }

          // Merge newMatches into main matches and check for chained powerups
          newMatches.forEach((nm) => {
            if (
              !matches.some(
                (existing) => existing.r === nm.r && existing.c === nm.c
              )
            ) {
              matches.push(nm);
              if (grid[nm.r] && grid[nm.r][nm.c]) {
                if (
                  ["bomb", "wipe", "flower"].includes(grid[nm.r][nm.c].type)
                ) {
                  powerupQueue.push(nm);
                }
              }
            }
          });
        }

        // 3. Mark for Popping
        matches.forEach((p) => {
          if (grid[p.r] && grid[p.r][p.c]) {
            grid[p.r][p.c].popStartTime = time;
          }
        });

        // 4. Cleanup & Gravity (Delayed)
        // Block input while finale processes
        isProcessingMatches = true;

        setTimeout(() => {
          matches.forEach((p) => {
            if (grid[p.r] && grid[p.r][p.c]) {
              const cell = grid[p.r][p.c];
              cell.ghostColor = null;
              cell.color = null;
              cell.type = "normal"; // Remove powerup status
              cell.bombAxis = null;
              cell.animDist = 0;
              cell.animVel = 0;
              cell.popStartTime = 0;
            }
          });

          // Score points for finale cleanup (optional, but satisfying)
          let points = matches.length * 50; // Bonus points for finale
          score += points;
          scoreEl.innerText = score;
          comboEl.innerText = "FINALE!";
          comboEl.style.opacity = 1;
          if (comboTimeout) clearTimeout(comboTimeout);
          comboTimeout = setTimeout(() => (comboEl.style.opacity = 0), 2000);

          const result = applyGravity();
          if (result.moved) {
            isFalling = true;
            checkQueue.push(...result.newCandidates);
          }

          isProcessingMatches = false;
        }, 400);

        return true;
      }

      window.addEventListener("resize", calculateDimensions);

      function getTriangleCenter(r, c) {
        const up = isPointingUp(r, c);
        const x = c * (TRIANGLE_WIDTH / 2);
        const y = r * TRIANGLE_HEIGHT;
        const cx = offsetX + x + TRIANGLE_WIDTH / 2;
        const cy =
          offsetY +
          (up ? y + TRIANGLE_HEIGHT * 0.66 : y + TRIANGLE_HEIGHT * 0.33);
        return { x: cx, y: cy };
      }

      function getLogicalPos(evt) {
        const rect = canvas.getBoundingClientRect();
        const mx = evt.clientX - rect.left;
        const my = evt.clientY - rect.top;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // Rotate -90 degrees around center to map Screen -> Logical
        // (x, y) -> (y, -x)
        // dx = mx - cx, dy = my - cy
        // lx = cx + dy
        // ly = cy - dx
        const lx = cx + (my - cy);
        const ly = cy - (mx - cx);
        return { x: lx, y: ly };
      }

      function getCellAt(lx, ly) {
        const hitRadius = TRIANGLE_WIDTH * 0.45;
        const hitRadiusSq = hitRadius * hitRadius;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const center = getTriangleCenter(r, c);
            const dx = lx - center.x;
            const dy = ly - center.y;
            if (dx * dx + dy * dy < hitRadiusSq) return { r, c };
          }
        }
        return null;
      }

      function getStrip(r, c, axis) {
        let strip = [];
        if (axis === "horiz") {
          for (let i = 0; i < COLS; i++) strip.push({ r, c: i });
          strip.sort((a, b) => a.c - b.c);
        } else if (axis === "diagA") {
          const k = Math.ceil((c - r) / 2);
          for (let rr = 0; rr < ROWS; rr++) {
            for (let cc = 0; cc < COLS; cc++) {
              if (Math.ceil((cc - rr) / 2) === k) strip.push({ r: rr, c: cc });
            }
          }
          strip.sort((a, b) => a.r + a.c - (b.r + b.c));
        } else if (axis === "diagB") {
          const k = Math.floor((c + r) / 2);
          for (let rr = 0; rr < ROWS; rr++) {
            for (let cc = 0; cc < COLS; cc++) {
              if (Math.floor((cc + rr) / 2) === k) strip.push({ r: rr, c: cc });
            }
          }
          strip.sort((a, b) => {
            if (a.r !== b.r) return b.r - a.r;
            return a.c - b.c;
          });
        }
        return strip;
      }

      function rotateArray(arr, steps) {
        if (arr.length === 0) return arr;
        const len = arr.length;
        const n = ((steps % len) + len) % len;
        return [...arr.slice(len - n), ...arr.slice(0, len - n)];
      }

      function rotateStripDataOnly(strip, shiftAmount) {
        const colors = strip.map((p) => grid[p.r][p.c].color);
        const types = strip.map((p) => grid[p.r][p.c].type);
        const bombAxes = strip.map((p) => grid[p.r][p.c].bombAxis);

        const newColors = rotateArray(colors, shiftAmount);
        const newTypes = rotateArray(types, shiftAmount);
        const newBombAxes = rotateArray(bombAxes, shiftAmount);

        strip.forEach((pos, i) => {
          grid[pos.r][pos.c].color = newColors[i];
          grid[pos.r][pos.c].type = newTypes[i];
          grid[pos.r][pos.c].bombAxis = newBombAxes[i];
          grid[pos.r][pos.c].animDist = 0;
          grid[pos.r][pos.c].initialAnimDist = 0; // Reset
          grid[pos.r][pos.c].animVel = 0;
          grid[pos.r][pos.c].ghostColor = null;
        });
      }

      function shiftStripData(strip, direction) {
        const shiftAmount = direction * drag.dataShift;
        drag.netDragShift += shiftAmount;
        rotateStripDataOnly(strip, shiftAmount);
      }

      function getNeighbors(r, c) {
        const n = [];
        if (c > 0) n.push({ r, c: c - 1 });
        if (c < COLS - 1) n.push({ r, c: c + 1 });
        const up = isPointingUp(r, c);
        if (up) {
          if (r < ROWS - 1) n.push({ r: r + 1, c: c });
        } else {
          if (r > 0) n.push({ r: r - 1, c: c });
        }
        return n;
      }

      function getExtendedNeighbors(r, c) {
        const neighbors = getNeighbors(r, c);
        const extended = new Set();
        const add = (n) => extended.add(`${n.r},${n.c}`);

        neighbors.forEach((n) => {
          add(n);
          const n2s = getNeighbors(n.r, n.c);
          n2s.forEach(add);
        });

        // Remove center
        extended.delete(`${r},${c}`);

        return Array.from(extended).map((str) => {
          const parts = str.split(",");
          return { r: parseInt(parts[0]), c: parseInt(parts[1]) };
        });
      }

      function getMatchGroups(candidates) {
        let visited = new Set();
        let groups = [];
        let uniqueCandidates = new Set(candidates.map((c) => `${c.r},${c.c}`));

        // Phase 1: Find all valid color-only matches (3+ same color, no powerups)
        uniqueCandidates.forEach((key) => {
          const [r, c] = key.split(",").map(Number);
          if (visited.has(key)) return;
          if (!grid[r] || !grid[r][c] || !grid[r][c].color) return;

          // Skip bombs AND FLOWERS in phase 1 (they're wildcards/triggers)
          // Wipes can match by color, so don't skip them
          if (grid[r][c].type === "bomb" || grid[r][c].type === "flower")
            return;

          // Start BFS for color-only matches
          let group = [];
          let queue = [{ r, c }];
          let visitedInGroup = new Set();
          visitedInGroup.add(key);
          group.push({ r, c });

          const targetColor = grid[r][c].color;

          let head = 0;
          while (head < queue.length) {
            const curr = queue[head++];
            const neighbors = getNeighbors(curr.r, curr.c);

            for (let neigh of neighbors) {
              const nKey = `${neigh.r},${neigh.c}`;
              if (!visited.has(nKey) && !visitedInGroup.has(nKey)) {
                const cell = grid[neigh.r][neigh.c];
                // Match same-colored cells (including wipes, but not bombs/flowers)
                if (
                  cell &&
                  cell.color === targetColor &&
                  cell.type !== "bomb" &&
                  cell.type !== "flower"
                ) {
                  visitedInGroup.add(nKey);
                  group.push(neigh);
                  queue.push(neigh);
                }
              }
            }
          }

          // Valid color match must have 3+ cells
          if (group.length >= 3) {
            groups.push(group);
            visitedInGroup.forEach((k) => visited.add(k));
          }
        });

        // Phase 2: Add adjacent powerups to valid color matches
        // Check ALL powerups on the board, not just those in candidates
        const powerupsToAdd = new Map(); // groupIndex -> [powerup cells]

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const cell = grid[r][c];
            if (!cell || !cell.color) continue;

            const cellType = cell.type;
            // Add bombs AND flowers in Phase 2, wipes match by color in Phase 1
            if (cellType !== "bomb" && cellType !== "flower") continue;

            // Check if this powerup is adjacent to any valid match group
            const neighbors = getNeighbors(r, c);
            for (let i = 0; i < groups.length; i++) {
              const group = groups[i];
              const isAdjacent = neighbors.some((neigh) =>
                group.some((cell) => cell.r === neigh.r && cell.c === neigh.c)
              );

              if (isAdjacent) {
                if (!powerupsToAdd.has(i)) {
                  powerupsToAdd.set(i, []);
                }
                powerupsToAdd.get(i).push({ r, c });
                break; // Only add to first adjacent group
              }
            }
          }
        }

        // Add powerups to their respective groups
        powerupsToAdd.forEach((powerups, groupIndex) => {
          groups[groupIndex].push(...powerups);
        });

        return groups;
      }

      function areGroupsAdjacent(groupA, groupB) {
        for (let cellA of groupA) {
          const neighbors = getNeighbors(cellA.r, cellA.c);
          for (let cellB of groupB) {
            if (neighbors.some((n) => n.r === cellB.r && n.c === cellB.c)) {
              return true;
            }
          }
        }
        return false;
      }

      function mergeAdjacentGroups(groups) {
        let superGroups = [];
        let visited = new Set(); // Set of group indices

        for (let i = 0; i < groups.length; i++) {
          if (visited.has(i)) continue;

          let superGroup = [...groups[i]];
          visited.add(i);
          let queue = [i];

          while (queue.length > 0) {
            let currentIdx = queue.shift();

            for (let j = 0; j < groups.length; j++) {
              if (!visited.has(j)) {
                if (areGroupsAdjacent(groups[currentIdx], groups[j])) {
                  visited.add(j);
                  superGroup.push(...groups[j]);
                  queue.push(j);
                }
              }
            }
          }
          superGroups.push(superGroup);
        }
        return superGroups;
      }

      function checkSpecificMatches(candidates) {
        const groups = getMatchGroups(candidates);
        // Flatten groups to unique matches for existing logic
        let matches = [];
        groups.forEach((g) => {
          g.forEach((p) => {
            if (!matches.some((m) => m.r === p.r && m.c === p.c)) {
              matches.push(p);
            }
          });
        });
        return matches;
      }

      function predictMatches() {
        if (!drag.active || !drag.lockedAxis || drag.strip.length === 0) return;

        const config = axisConfig[drag.lockedAxis];
        const predictedAdditionalShift =
          Math.round(drag.pixelOffset / config.step) * drag.dataShift;
        const strip = drag.strip;
        const len = strip.length;

        const totalShift = drag.netDragShift + predictedAdditionalShift;
        const normalizedTotalShift = ((totalShift % len) + len) % len;

        if (normalizedTotalShift === 0) {
          predictedMatches = [];
          return;
        }

        if (predictedAdditionalShift === 0) {
          predictedMatches = checkSpecificMatches(strip);
        } else {
          const currentColors = strip.map((p) => grid[p.r][p.c].color);
          const rotatedColors = rotateArray(
            currentColors,
            predictedAdditionalShift
          );
          const oldColors = strip.map((p) => grid[p.r][p.c].color);

          strip.forEach((p, i) => (grid[p.r][p.c].color = rotatedColors[i]));
          predictedMatches = checkSpecificMatches(strip);
          strip.forEach((p, i) => (grid[p.r][p.c].color = oldColors[i]));
        }
      }

      function applyGravity() {
        let moved = false;
        let newCandidates = [];

        // Dynamic Gravity Grouping based on Active Axis
        let stripsByKey = {};
        const axis = activeGravity.axis;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            let k;
            if (axis === "horiz") {
              k = r; // Group by row
            } else if (axis === "diagA") {
              k = Math.ceil((c - r) / 2);
            } else {
              // diagB
              k = Math.floor((c + r) / 2);
            }

            if (!stripsByKey[k]) stripsByKey[k] = [];
            stripsByKey[k].push({ r, c });
          }
        }

        const stepDist = axisConfig[axis].step;
        const dir = activeGravity.dir; // +1 or -1

        // Calculate Stride (Physical distance per array index)
        let stride = 0;
        if (axis === "horiz") {
          // Horizontal cells are packed closely (w/2)
          stride = TRIANGLE_WIDTH / 2;
        } else {
          // Diagonals alternate between H and W. A good approximation is Height.
          stride = TRIANGLE_HEIGHT;
        }

        Object.values(stripsByKey).forEach((strip) => {
          strip.sort((a, b) => {
            let valA, valB;
            if (axis === "horiz") {
              valA = a.c;
              valB = b.c;
            } else if (axis === "diagA") {
              valA = a.r;
              valB = b.r;
            } else {
              valA = a.c;
              valB = b.c;
            }

            if (dir === 1) {
              return valA - valB;
            } else {
              return valB - valA;
            }
          });

          for (let i = strip.length - 1; i >= 0; i--) {
            const curr = strip[i];

            if (grid[curr.r][curr.c].color === null) {
              let foundIndex = -1;
              const destUp = isPointingUp(curr.r, curr.c);

              // Look towards Source (0)
              for (let j = i - 1; j >= 0; j--) {
                const check = strip[j];
                const sourceUp = isPointingUp(check.r, check.c);

                // GRAVITY UPDATE: Pull from any source in the strip (swapping orientation if needed)
                if (grid[check.r][check.c].color !== null) {
                  foundIndex = j;
                  break;
                }
              }

              const currCenter = getTriangleCenter(curr.r, curr.c);

              if (foundIndex !== -1) {
                const source = strip[foundIndex];
                const sourceCell = grid[source.r][source.c];
                const sourceCenter = getTriangleCenter(source.r, source.c);
                const currCell = grid[curr.r][curr.c];

                currCell.color = sourceCell.color;
                currCell.type = sourceCell.type; // Move type
                currCell.bombAxis = sourceCell.bombAxis; // Move bomb axis property

                // Calculate Exact Physical Distance for AnimDist
                const dist = Math.sqrt(
                  Math.pow(sourceCenter.x - currCenter.x, 2) +
                    Math.pow(sourceCenter.y - currCenter.y, 2)
                );

                // Inherit momentum + exact physical gap
                currCell.animDist = sourceCell.animDist + dist;
                currCell.animVel = sourceCell.animVel;
                // Store initial full distance for rotation logic
                currCell.initialAnimDist = currCell.animDist;

                sourceCell.color = null;
                sourceCell.type = "normal"; // Reset source type
                sourceCell.bombAxis = null;
                sourceCell.animDist = 0;
                sourceCell.initialAnimDist = 0;
                sourceCell.animVel = 0;

                newCandidates.push(curr);
                moved = true;
              } else {
                // No source found, generate new
                const currCell = grid[curr.r][curr.c];
                currCell.color =
                  PALETTE[Math.floor(Math.random() * PALETTE.length)];
                currCell.type = "normal"; // Ensure new cells are normal
                currCell.bombAxis = null;

                // Logic: 'i' is the index in the sorted strip (0 is source, Last is dest)
                // We are at 'i'. We looked back to 0 and found nothing.
                // This means we are filling from off-screen.
                // The "virtual" source is (i + 1) slots away in the negative direction.
                // Using 'stride' gives the correct physical distance.

                // UPDATE: If we are enforcing orientation, we might be hopping.
                // For simplicity, we keep the linear distance metric, but maybe boost it if hopping?
                // If axis is horiz, we hop (stride 2). If diag, we don't (stride 1).
                // Actually, let's just use linear distance. It will slide in from "neighbor".
                // If neighbor is wrong orientation, it might look like a flip, but it's a NEW tile.
                // So it's acceptable.
                currCell.animDist = (i + 1) * stride;
                currCell.initialAnimDist = currCell.animDist;
                currCell.animVel = 0;

                newCandidates.push(curr);
                moved = true;
              }
            }
          }
        });

        return { moved, newCandidates };
      }

      function updateFallingPhysics(dtFactor) {
        if (!isFalling) return;

        let activeCount = 0;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const cell = grid[r][c];

            if (cell.animDist > 0.1 || Math.abs(cell.animVel) > 0.1) {
              activeCount++;

              // Scale gravity by dtFactor (time scaling)
              cell.animVel -= GRAVITY_ACCEL * dtFactor;
              cell.animDist += cell.animVel * dtFactor;

              if (cell.animDist <= 0) {
                cell.animDist = 0;
                // Bounce dampening is an impulse (instantaneous change), so it doesn't need dt scaling
                cell.animVel = -cell.animVel * BOUNCE_DAMPING;
                cell.ghostColor = null;

                if (Math.abs(cell.animVel) < GRAVITY_ACCEL * 2) {
                  cell.animVel = 0;
                }
              }
            } else {
              cell.animDist = 0;
              cell.animVel = 0;
              cell.ghostColor = null;
            }
          }
        }

        if (activeCount === 0) {
          isFalling = false;
          if (checkQueue.length > 0) {
            resolveMatches(checkQueue);
            checkQueue = [];
          } else {
            if (movesLeft <= 0 && !isGameOver) {
              // Check for Grand Finale before ending
              if (!processGrandFinale()) {
                endGame();
              }
            }
          }
        }
      }

      function resolveMatches(candidates, silent = false) {
        if (isFalling) {
          checkQueue.push(...candidates);
          return;
        }

        isProcessingMatches = true;
        const groups = getMatchGroups(candidates);

        // --- NEW INTERACTION LOGIC: Now creates FLOWERS ---
        // Find pairs of matches of different colors that are within distance 2
        const flowerCandidateCells = new Set();
        const validGroups = groups.filter((g) => g.length >= 3);

        for (let i = 0; i < validGroups.length; i++) {
          for (let j = i + 1; j < validGroups.length; j++) {
            const gA = validGroups[i];
            const gB = validGroups[j];
            const colorA = grid[gA[0].r][gA[0].c].color;
            const colorB = grid[gB[0].r][gB[0].c].color;

            if (colorA === colorB) continue;

            let interact = false;
            // Check distance: inefficient but safe given small grid
            // Collect all extended neighbors (dist 1 & 2) of A
            // EXCLUDE POWERUPS from distance calculation to prevent chaining through them
            const extA = new Set();
            gA.forEach((c) => {
              const cellType = grid[c.r][c.c].type;
              if (["bomb", "wipe", "flower"].includes(cellType)) return;
              getExtendedNeighbors(c.r, c.c).forEach((n) =>
                extA.add(`${n.r},${n.c}`)
              );
            });

            // Check if any cell in B is in extA
            for (let c of gB) {
              const cellType = grid[c.r][c.c].type;
              if (["bomb", "wipe", "flower"].includes(cellType)) continue;

              if (extA.has(`${c.r},${c.c}`)) {
                interact = true;
                break;
              }
            }

            if (interact) {
              // Mark all cells in both groups as flower candidates
              gA.forEach((c) => flowerCandidateCells.add(`${c.r},${c.c}`));
              gB.forEach((c) => flowerCandidateCells.add(`${c.r},${c.c}`));
            }
          }
        }

        // Check for Powerups (Super Groups)
        const superGroups = mergeAdjacentGroups(groups);
        let bombLocations = [];
        let wipeLocations = [];
        let flowerLocations = [];

        superGroups.forEach((superGroup) => {
          const uniqueCells = superGroup;
          const size = uniqueCells.length;

          // Flower created on interaction
          let isFlower = superGroup.some((c) =>
            flowerCandidateCells.has(`${c.r},${c.c}`)
          );
          let isBomb = false; // Bomb created on Line of 4
          let bombAxis = "horiz"; // Default

          // Check for line of 4: MUST BE SAME COLOR
          const cellsByColor = {};
          superGroup.forEach((c) => {
            const color = grid[c.r][c.c].color;
            if (!cellsByColor[color]) cellsByColor[color] = [];
            cellsByColor[color].push(c);
          });

          // Store cells involved in lines to prioritize spawn for bombs
          let bombLineCells = [];
          // Store potential wipes (color groups >= 7)
          let wipeCandidateColors = []; // Array of array of cells

          // Only check line logic within same-color subgroups
          Object.entries(cellsByColor).forEach(([color, colorCells]) => {
            // Check for Wipe (>= 7 same color)
            if (colorCells.length >= 7) {
              wipeCandidateColors.push(colorCells);
            }

            if (isBomb) return; // Optimization for bomb check

            // Horizontal Check
            const rowBuckets = {};
            colorCells.forEach((c) => {
              if (!rowBuckets[c.r]) rowBuckets[c.r] = [];
              rowBuckets[c.r].push(c.c);
            });

            // Horizontal Capture
            Object.entries(rowBuckets).forEach(([rStr, cols]) => {
              const r = parseInt(rStr);
              cols.sort((a, b) => a - b);
              let currentStreak = [cols[0]];
              for (let i = 1; i < cols.length; i++) {
                if (cols[i] === cols[i - 1] + 1) currentStreak.push(cols[i]);
                else {
                  if (currentStreak.length >= 4) {
                    isBomb = true;
                    bombAxis = "horiz";
                    bombLineCells.push(...currentStreak.map((c) => ({ r, c })));
                  }
                  currentStreak = [cols[i]];
                }
              }
              if (currentStreak.length >= 4) {
                isBomb = true;
                bombAxis = "horiz";
                bombLineCells.push(...currentStreak.map((c) => ({ r, c })));
              }
            });

            // DiagA Check
            if (!isBomb) {
              const daBuckets = {};
              colorCells.forEach((c) => {
                const k = Math.ceil((c.c - c.r) / 2);
                if (!daBuckets[k]) daBuckets[k] = [];
                daBuckets[k].push(c);
              });
              Object.values(daBuckets).forEach((cells) => {
                cells.sort((a, b) => a.r + a.c - (b.r + b.c));
                let currentStreak = [cells[0]];
                for (let i = 1; i < cells.length; i++) {
                  if (
                    cells[i].r + cells[i].c ===
                    cells[i - 1].r + cells[i - 1].c + 1
                  )
                    currentStreak.push(cells[i]);
                  else {
                    if (currentStreak.length >= 4) {
                      isBomb = true;
                      bombAxis = "diagA";
                      bombLineCells.push(...currentStreak);
                    }
                    currentStreak = [cells[i]];
                  }
                }
                if (currentStreak.length >= 4) {
                  isBomb = true;
                  bombAxis = "diagA";
                  bombLineCells.push(...currentStreak);
                }
              });
            }

            // DiagB Check
            if (!isBomb) {
              const dbBuckets = {};
              colorCells.forEach((c) => {
                const k = Math.floor((c.c + c.r) / 2);
                if (!dbBuckets[k]) dbBuckets[k] = [];
                dbBuckets[k].push(c);
              });
              Object.values(dbBuckets).forEach((cells) => {
                cells.sort((a, b) => a.c - a.r - (b.c - b.r));
                let currentStreak = [cells[0]];
                for (let i = 1; i < cells.length; i++) {
                  if (
                    cells[i].c - cells[i].r ===
                    cells[i - 1].c - cells[i - 1].r + 1
                  )
                    currentStreak.push(cells[i]);
                  else {
                    if (currentStreak.length >= 4) {
                      isBomb = true;
                      bombAxis = "diagB";
                      bombLineCells.push(...currentStreak);
                    }
                    currentStreak = [cells[i]];
                  }
                }
                if (currentStreak.length >= 4) {
                  isBomb = true;
                  bombAxis = "diagB";
                  bombLineCells.push(...currentStreak);
                }
              });
            }
          });

          if (wipeCandidateColors.length > 0 || isBomb || isFlower) {
            console.log(
              `Powerup! Size: ${size}, Flower: ${isFlower}, Bomb: ${isBomb} (${bombAxis}), Wipes: ${wipeCandidateColors.length}`
            );

            const detonatedRows = new Set();
            superGroup.forEach((cell) => {
              if (grid[cell.r][cell.c].type === "bomb")
                detonatedRows.add(cell.r);
            });

            let availableCells = [...superGroup].filter(
              (c) => !detonatedRows.has(c.r)
            );
            if (availableCells.length === 0) availableCells = [...superGroup];

            const assignCell = (preferOrigin, specificCandidates = null) => {
              let target = null;

              if (preferOrigin && drag.originCell && specificCandidates) {
                const idx = specificCandidates.findIndex(
                  (c) => c.r === drag.originCell.r && c.c === drag.originCell.c
                );
                if (idx !== -1) {
                  // Check if target is still in availableCells (hasn't been used)
                  const availableIdx = availableCells.findIndex(
                    (c) =>
                      c.r === drag.originCell.r && c.c === drag.originCell.c
                  );
                  if (availableIdx !== -1) {
                    target = availableCells[availableIdx];
                    availableCells.splice(availableIdx, 1);
                    return target;
                  }
                }
              }

              if (!target && specificCandidates) {
                const validSpecifics = specificCandidates.filter((sc) =>
                  availableCells.some((ac) => ac.r === sc.r && ac.c === sc.c)
                );

                if (validSpecifics.length > 0) {
                  const rnd =
                    validSpecifics[
                      Math.floor(Math.random() * validSpecifics.length)
                    ];
                  const availableIdx = availableCells.findIndex(
                    (c) => c.r === rnd.r && c.c === rnd.c
                  );
                  target = availableCells[availableIdx];
                  availableCells.splice(availableIdx, 1);
                  return target;
                }
              }

              if (!target && preferOrigin && drag.originCell) {
                const idx = availableCells.findIndex(
                  (c) => c.r === drag.originCell.r && c.c === drag.originCell.c
                );
                if (idx !== -1) {
                  target = availableCells[idx];
                  availableCells.splice(idx, 1);
                }
              }

              if (!target && availableCells.length > 0) {
                const idx = Math.floor(Math.random() * availableCells.length);
                target = availableCells[idx];
                availableCells.splice(idx, 1);
              }
              return target;
            };

            // Wipes (Priority)
            wipeCandidateColors.forEach((candidates) => {
              const cell = assignCell(true, candidates);
              if (cell) wipeLocations.push(cell);
            });

            // Flower (Interaction)
            if (isFlower) {
              const cell = assignCell(true);
              if (cell) flowerLocations.push(cell);
            }

            // Bomb (Line)
            if (isBomb) {
              const cell = assignCell(false, bombLineCells);
              if (cell) {
                cell.bombAxis = bombAxis; // Set bomb axis
                bombLocations.push(cell);
              }
            }
          }
        });

        // Flatten for processing
        let matches = [];
        groups.forEach((g) => {
          g.forEach((p) => {
            if (!matches.some((m) => m.r === p.r && m.c === p.c)) {
              matches.push(p);
            }
          });
        });

        if (matches.length > 0) {
          if (!silent) {
            let points = matches.length * 10 * scoreMultiplier;
            score += points;
            scoreEl.innerText = score;

            comboEl.innerText =
              scoreMultiplier > 1 ? `MATCH! x${scoreMultiplier}` : "MATCH!";
            comboEl.style.opacity = 1;

            if (comboTimeout) clearTimeout(comboTimeout);
            comboTimeout = setTimeout(() => (comboEl.style.opacity = 0), 2000);

            scoreMultiplier++;
          }

          // --- POWERUP ACTIVATION LOGIC (Cascading) ---
          let processedPowerups = new Set();
          // Initialize queue with all powerups found in the current match set
          let powerupQueue = matches.filter((m) =>
            ["bomb", "wipe", "flower"].includes(grid[m.r][m.c].type)
          );

          let head = 0;
          while (head < powerupQueue.length) {
            const p = powerupQueue[head++];
            const key = `${p.r},${p.c}`;

            if (processedPowerups.has(key)) continue;
            processedPowerups.add(key);

            const cell = grid[p.r][p.c];
            const type = cell.type;
            let newMatches = [];

            if (type === "bomb") {
              const axis = cell.bombAxis || "horiz";
              bombEffects.push({
                r: p.r,
                c: p.c,
                axis: axis,
                startTime: time,
                duration: 600,
              });
              // Collect cells in strip
              const strip = getStrip(p.r, p.c, axis);
              newMatches.push(...strip);
            } else if (type === "wipe") {
              const targetColor = cell.color;
              if (targetColor) {
                console.log(`Wipe activated! Destroying ${targetColor}`);
                for (let r = 0; r < ROWS; r++) {
                  for (let c = 0; c < COLS; c++) {
                    if (grid[r][c].color === targetColor) {
                      newMatches.push({ r, c });
                    }
                  }
                }
              }
            } else if (type === "flower") {
              console.log("Flower activated!");
              const neighbors = getExtendedNeighbors(p.r, p.c);
              flowerEffects.push({
                r: p.r,
                c: p.c,
                affectedCells: neighbors,
                startTime: time,
                duration: 600,
              });
              newMatches.push(...neighbors);
            }

            // Merge newMatches into main matches
            newMatches.forEach((nm) => {
              if (
                !matches.some(
                  (existing) => existing.r === nm.r && existing.c === nm.c
                )
              ) {
                matches.push(nm);
                // If this new matched cell is a powerup, add to queue so it detonates too
                if (
                  ["bomb", "wipe", "flower"].includes(grid[nm.r][nm.c].type)
                ) {
                  powerupQueue.push(nm);
                }
              }
            });
          }

          // Filter out NEW powerup locations from being popped
          const popMatches = matches.filter(
            (m) =>
              !bombLocations.some((b) => b.r === m.r && b.c === m.c) &&
              !wipeLocations.some((w) => w.r === m.r && w.c === m.c) &&
              !flowerLocations.some((f) => f.r === m.r && f.c === m.c)
          );

          popMatches.forEach((p) => {
            if (grid[p.r] && grid[p.r][p.c]) grid[p.r][p.c].popStartTime = time;
          });

          // Create Bombs
          bombLocations.forEach((b) => {
            const cell = grid[b.r][b.c];
            cell.type = "bomb";
            cell.bombAxis = b.bombAxis; // Set axis
            cell.popStartTime = 0;
            cell.spawnTime = time;
          });

          // Create Wipes
          wipeLocations.forEach((w) => {
            const cell = grid[w.r][w.c];
            cell.type = "wipe";
            cell.popStartTime = 0;
            cell.spawnTime = time;
          });

          // Create Flowers
          flowerLocations.forEach((f) => {
            const cell = grid[f.r][f.c];
            cell.type = "flower";
            cell.popStartTime = 0;
            cell.spawnTime = time;
          });

          setTimeout(() => {
            popMatches.forEach((p) => {
              if (grid[p.r] && grid[p.r][p.c]) {
                const cell = grid[p.r][p.c];
                cell.ghostColor = null;
                cell.color = null;
                cell.type = "normal";
                cell.bombAxis = null;
                cell.animDist = 0;
                cell.animVel = 0;
                cell.popStartTime = 0;
              }
            });

            const result = applyGravity();
            if (result.moved) {
              isFalling = true;
              checkQueue.push(...result.newCandidates);
            } else {
              isProcessingMatches = false;
              if (movesLeft <= 0 && !isGameOver) {
                if (!processGrandFinale()) endGame();
              }
            }
          }, 400);
        } else {
          isProcessingMatches = false;
          if (movesLeft <= 0 && !isGameOver) {
            if (!processGrandFinale()) endGame();
          }
        }
      }

      canvas.addEventListener("pointerdown", (e) => {
        if (
          isProcessingMatches ||
          isFalling ||
          drag.isReverting ||
          isGameOver ||
          movesLeft <= 0
        )
          return;

        drag.velocity = 0;
        drag.isAnimating = false;
        drag.pixelOffset = 0;
        drag.netDragShift = 0;
        drag.isReverting = false;
        predictedMatches = [];

        const pos = getLogicalPos(e);
        const cell = getCellAt(pos.x, pos.y);
        if (cell) {
          drag.active = true;
          drag.start = { x: pos.x, y: pos.y };
          drag.current = { x: pos.x, y: pos.y };
          drag.originCell = cell;
          drag.lockedAxis = null;
          drag.strip = [];
          drag.lastProjection = 0;
          canvas.setPointerCapture(e.pointerId);
        }
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!drag.active) return;

        const pos = getLogicalPos(e);
        drag.current = { x: pos.x, y: pos.y };
        const dx = drag.current.x - drag.start.x;
        const dy = drag.current.y - drag.start.y;

        if (!drag.lockedAxis) {
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > 5) {
            const ndx = dx / dist;
            const ndy = dy / dist;

            const scoreH = Math.abs(
              ndx * axisConfig.horiz.x + ndy * axisConfig.horiz.y
            );
            const scoreDA = Math.abs(
              ndx * axisConfig.diagA.x + ndy * axisConfig.diagA.y
            );
            const scoreDB = Math.abs(
              ndx * axisConfig.diagB.x + ndy * axisConfig.diagB.y
            );

            let bestAxis = "horiz";
            let maxScore = scoreH;
            if (scoreDA > maxScore) {
              maxScore = scoreDA;
              bestAxis = "diagA";
            }
            if (scoreDB > maxScore) {
              maxScore = scoreDB;
              bestAxis = "diagB";
            }

            if (maxScore > 0.96 || dist > 20) {
              drag.lockedAxis = bestAxis;
              drag.strip = getStrip(
                drag.originCell.r,
                drag.originCell.c,
                drag.lockedAxis
              );
              drag.dataShift = 2;
              const config = axisConfig[bestAxis];
              drag.lastProjection = dx * config.x + dy * config.y;
            }
          }
        }

        if (drag.lockedAxis) {
          const config = axisConfig[drag.lockedAxis];
          const projection = dx * config.x + dy * config.y;
          drag.velocity = projection - drag.lastProjection;
          drag.lastProjection = projection;
          drag.pixelOffset = projection;
          handleShift();
          predictMatches();
        }
      });

      canvas.addEventListener("pointerup", stopDrag);
      canvas.addEventListener("pointercancel", stopDrag);

      function stopDrag() {
        if (drag.active && drag.lockedAxis) {
          drag.active = false;
          predictedMatches = [];

          const config = axisConfig[drag.lockedAxis];
          const snapSteps = Math.round(drag.pixelOffset / config.step);

          if (drag.netDragShift !== 0 || snapSteps !== 0) {
            const strip = drag.strip;

            const snapShift = snapSteps * drag.dataShift;
            if (snapShift !== 0) {
              const currentColors = strip.map((p) => grid[p.r][p.c].color);
              const rotatedColors = rotateArray(currentColors, snapShift);
              strip.forEach(
                (p, i) => (grid[p.r][p.c].color = rotatedColors[i])
              );
            }

            const potentialMatches = checkSpecificMatches(strip);

            if (snapShift !== 0) {
              const currentColors = strip.map((p) => grid[p.r][p.c].color);
              const rotatedColors = rotateArray(currentColors, -snapShift);
              strip.forEach(
                (p, i) => (grid[p.r][p.c].color = rotatedColors[i])
              );
            }

            if (potentialMatches.length > 0) {
              drag.isAnimating = true;
              scoreMultiplier = 1;
              movesLeft--;
              movesEl.innerText = movesLeft;

              // Gravity always falls down on screen (Logical Horiz +1)
              activeGravity = {
                axis: "horiz",
                dir: 1,
              };
            } else {
              drag.isReverting = true;
              drag.isAnimating = true;
              invalidMoveTime = time;
            }
          } else {
            drag.velocity = 0;
            drag.pixelOffset = 0;
            drag.lockedAxis = null;
            drag.strip = [];
          }
        } else {
          drag.active = false;
          drag.lockedAxis = null;
          drag.strip = [];
        }
      }

      function handleShift() {
        const config = axisConfig[drag.lockedAxis];
        if (!config) return false;

        const step = config.step;
        const halfStep = step / 2;
        let shifted = false;

        while (drag.pixelOffset > halfStep) {
          shiftStripData(drag.strip, 1);
          drag.pixelOffset -= step;
          if (drag.active) {
            drag.start.x += step * config.x;
            drag.start.y += step * config.y;
            drag.lastProjection -= step;
          }
          shifted = true;
        }

        while (drag.pixelOffset < -halfStep) {
          shiftStripData(drag.strip, -1);
          drag.pixelOffset += step;
          if (drag.active) {
            drag.start.x -= step * config.x;
            drag.start.y -= step * config.y;
            drag.lastProjection += step;
          }
          shifted = true;
        }
        return shifted;
      }

      function updatePhysics(dtFactor) {
        if (drag.active) return;

        if (drag.isAnimating) {
          if (drag.isReverting) {
            const config = axisConfig[drag.lockedAxis];
            const targetOffset =
              -(drag.netDragShift / drag.dataShift) * config.step;

            const diff = targetOffset - drag.pixelOffset;

            // Scaled revert spring logic
            drag.velocity = diff * REVERT_STIFFNESS * dtFactor;
            drag.pixelOffset += drag.velocity * dtFactor;

            handleShift();

            if (
              drag.netDragShift === 0 &&
              Math.abs(drag.pixelOffset) < 2 &&
              Math.abs(drag.velocity) < 1
            ) {
              drag.pixelOffset = 0;
              drag.velocity = 0;
              drag.isReverting = false;
              drag.isAnimating = false;
              drag.lockedAxis = null;
              drag.strip = [];
            }
          } else {
            drag.pixelOffset += drag.velocity * dtFactor;

            // Frame-rate independent friction
            // 0.9 per frame at 120fps becomes pow(0.9, dtFactor)
            drag.velocity *= Math.pow(0.9, dtFactor);

            handleShift();

            if (Math.abs(drag.velocity) < 0.5) {
              if (Math.abs(drag.pixelOffset) > 5) {
                drag.pixelOffset *= Math.pow(0.8, dtFactor); // Damping also scaled
              } else {
                const strip = drag.strip;
                if (drag.netDragShift !== 0) {
                  resolveMatches(strip);
                }

                drag.velocity = 0;
                drag.pixelOffset = 0;
                drag.isAnimating = false;
                drag.lockedAxis = null;
                drag.strip = [];
                drag.netDragShift = 0;
              }
            }
          }
        }
      }

      function drawTriangleShape(ctx, r, c, cx, cy, w, h, up, pad = 0) {
        if (up) {
          ctx.moveTo(cx, cy - 0.66 * h - pad);
          ctx.lineTo(cx + 0.5 * w + pad, cy + 0.33 * h + pad);
          ctx.lineTo(cx - 0.5 * w - pad, cy + 0.33 * h + pad);
        } else {
          ctx.moveTo(cx - 0.5 * w - pad, cy - 0.33 * h - pad);
          ctx.lineTo(cx + 0.5 * w + pad, cy - 0.33 * h - pad);
          ctx.lineTo(cx, cy + 0.66 * h + pad);
        }
        ctx.closePath();
      }

      function drawTriangle(r, c, dragOffset, colorOverride = null) {
        const cell = grid[r] && grid[r][c];
        if (colorOverride) {
          drawSingleTriangleLayer(r, c, dragOffset, colorOverride, false);
          return;
        }
        if (!cell) return;

        if (cell.popStartTime > 0) {
          drawPoppingTriangle(r, c, dragOffset, cell);
          return;
        }

        if (cell.spawnTime > 0 && time - cell.spawnTime < 400) {
          drawSpawningTriangle(r, c, dragOffset, cell);
          return;
        }

        if (cell.ghostColor) {
          drawSingleTriangleLayer(r, c, dragOffset, cell.ghostColor, true);
        }
        if (cell.color) {
          drawSingleTriangleLayer(r, c, dragOffset, cell.color, false);
        }
      }

      function drawSpawningTriangle(r, c, dragOffset, cell) {
        const elapsed = time - cell.spawnTime;
        const duration = 400;
        const t = Math.min(elapsed / duration, 1);

        // Elastic Scale: Overshoot to 1.2 then settle to 1.0
        // sin(t * PI) gives a hump.
        // Let's use a simple elastic out or just a sin bump.
        // 0 -> 1.2 -> 1.0
        let scale = 1;
        if (t < 0.5) {
          scale = t * 2.4; // 0 to 1.2
        } else {
          scale = 1.2 - (t - 0.5) * 0.4; // 1.2 to 1.0
        }

        let finalX = 0;
        let finalY = 0;
        if (dragOffset) {
          finalX += dragOffset.x;
          finalY += dragOffset.y;
        }

        const center = getTriangleCenter(r, c);
        const cx = center.x + finalX;
        const cy = center.y + finalY;
        const up = isPointingUp(r, c);

        const w = TRIANGLE_WIDTH * scale;
        const h = TRIANGLE_HEIGHT * scale;

        // Flash Effect
        if (t < 0.5) {
          ctx.save();
          ctx.globalAlpha = 1 - t * 2;
          ctx.beginPath();
          ctx.arc(cx, cy, TRIANGLE_WIDTH * 0.8, 0, Math.PI * 2);
          ctx.fillStyle = "#fff";
          ctx.fill();
          ctx.restore();
        }

        // Draw Bomb
        ctx.beginPath();
        drawTriangleShape(ctx, r, c, cx, cy, w, h, up, 0);
        ctx.fillStyle = "#475569";
        ctx.strokeStyle = "#fff"; // Highlight stroke during spawn
        ctx.lineWidth = Math.max(2, TRIANGLE_WIDTH * 0.05);
        ctx.lineJoin = "round";
        ctx.fill();
        ctx.stroke();

        // Differentiate between bomb and wipe icons
        if (cell.type === "wipe") {
          // Wipe Icon: Double circle with radiating lines
          // REDUCED SIZE 50%
          const iconScale = scale * 0.5;
          ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
          ctx.beginPath();
          ctx.arc(cx, cy, TRIANGLE_WIDTH * 0.2 * iconScale, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(cx, cy, TRIANGLE_WIDTH * 0.3 * iconScale, 0, Math.PI * 2);
          ctx.stroke();

          // Radiating lines
          for (let i = 0; i < 4; i++) {
            const angle = (i * Math.PI) / 2 + Math.PI / 4;
            const r1 = TRIANGLE_WIDTH * 0.32 * iconScale;
            const r2 = TRIANGLE_WIDTH * 0.42 * iconScale;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(angle) * r1, cy + Math.sin(angle) * r1);
            ctx.lineTo(cx + Math.cos(angle) * r2, cy + Math.sin(angle) * r2);
            ctx.stroke();
          }
        } else if (cell.type === "bomb") {
          // Bomb Icon: Single circle with fuse
          // REDUCED SIZE 50%
          const iconScale = scale * 0.5;
          ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
          ctx.beginPath();
          ctx.arc(cx, cy, TRIANGLE_WIDTH * 0.25 * iconScale, 0, Math.PI * 2);
          ctx.fill();

          // Fuse
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(cx, cy - TRIANGLE_WIDTH * 0.25 * iconScale);
          ctx.quadraticCurveTo(
            cx + 5 * iconScale,
            cy - TRIANGLE_WIDTH * 0.4 * iconScale,
            cx + 10 * iconScale,
            cy - TRIANGLE_WIDTH * 0.35 * iconScale
          );
          ctx.stroke();

          // Spark
          ctx.fillStyle = "#fbbf24";
          ctx.beginPath();
          ctx.arc(
            cx + 10 * iconScale,
            cy - TRIANGLE_WIDTH * 0.35 * iconScale,
            2 * iconScale,
            0,
            Math.PI * 2
          );
          ctx.fill();
        } else if (cell.type === "flower") {
          // Flower Icon
          // REDUCED SIZE 50%
          const iconScale = scale * 0.5;
          const radius = TRIANGLE_WIDTH * 0.15 * iconScale;

          // Center dot
          ctx.fillStyle = "#fbbf24";
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.fill();

          // Petals
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 2;
          for (let i = 0; i < 6; i++) {
            const angle = (i * Math.PI) / 3;
            const dist = TRIANGLE_WIDTH * 0.25 * iconScale;
            const px = cx + Math.cos(angle) * dist;
            const py = cy + Math.sin(angle) * dist;
            ctx.beginPath();
            ctx.arc(px, py, radius * 0.8, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      }

      function drawPoppingTriangle(r, c, dragOffset, cell) {
        const elapsed = time - cell.popStartTime;
        const duration = 300;

        const t = Math.min(elapsed / duration, 1);
        const scale = 1 + Math.sin(t * Math.PI) * 0.2;
        const alpha = 1 - t;

        let finalX = 0;
        let finalY = 0;
        if (dragOffset) {
          finalX += dragOffset.x;
          finalY += dragOffset.y;
        }

        const center = getTriangleCenter(r, c);
        const cx = center.x + finalX;
        const cy = center.y + finalY;
        const up = isPointingUp(r, c);

        const w = TRIANGLE_WIDTH * scale;
        const h = TRIANGLE_HEIGHT * scale;

        ctx.beginPath();
        drawTriangleShape(ctx, r, c, cx, cy, w, h, up, 0);

        ctx.fillStyle = cell.color;
        ctx.globalAlpha = alpha;
        ctx.fill();
        ctx.globalAlpha = 1.0;

        if (t < 0.5) {
          ctx.fillStyle = `rgba(255,255,255,${0.5 - t})`;
          ctx.fill();
        }
      }

      function getMorphedVertices(destUp, t, w, h) {
        const h1 = 0.66 * h;
        const h2 = 0.33 * h;
        const w2 = 0.5 * w;

        // Vertices relative to center (0,0)
        // Up: T(0, -h1), BR(w2, h2), BL(-w2, h2)
        // Down: B(0, h1), TR(w2, -h2), TL(-w2, -h2)

        // Lerp helper
        const l = (a, b) => a + (b - a) * t;

        let v1, v2, v3;

        if (!destUp) {
          // Source is Up -> Dest is Down
          // T -> TR
          v1 = { x: l(0, w2), y: l(-h1, -h2) };
          // BR -> B
          v2 = { x: l(w2, 0), y: l(h2, h1) };
          // BL -> TL
          v3 = { x: l(-w2, -w2), y: l(h2, -h2) };
        } else {
          // Source is Down -> Dest is Up
          // TL -> BL
          v1 = { x: l(-w2, -w2), y: l(-h2, h2) }; // This effectively becomes BL
          // TR -> T
          v2 = { x: l(w2, 0), y: l(-h2, -h1) }; // This becomes T
          // B -> BR
          v3 = { x: l(0, w2), y: l(h1, h2) }; // This becomes BR
        }
        return [v1, v2, v3];
      }

      function drawSingleTriangleLayer(r, c, dragOffset, color, isGhost) {
        const center = getTriangleCenter(r, c);
        let finalX = 0;
        let finalY = 0;

        if (dragOffset) {
          finalX += dragOffset.x;
          finalY += dragOffset.y;
        }

        let renderCx = center.x + finalX;
        let renderCy = center.y + finalY;

        let vertices = null; // If null, use standard drawTriangleShape

        if (!isGhost && grid[r] && grid[r][c] && grid[r][c].animDist > 0.1) {
          const cell = grid[r][c];
          const axis = activeGravity.axis;
          const config = axisConfig[axis];
          const dir = activeGravity.dir;

          // Default interpolation for other axes (e.g., diagonals)
          // For Horizontal axis (Visual Vertical), we use advanced morphing
          if (axis === "horiz") {
            const stride = TRIANGLE_WIDTH / 2;
            const totalSlots = Math.round(cell.initialAnimDist / stride);

            // 1. Fix Position Interpolation (Wobble Fix)
            // Instead of linear slide which ignores the zigzag, interpolate between Source Center and Dest Center
            const ratio = cell.animDist / cell.initialAnimDist; // 1.0 -> 0.0
            const t = 1 - ratio; // 0.0 -> 1.0

            const sourceC = c - totalSlots * dir;

            const sourceCenter = getTriangleCenter(r, sourceC);
            const destCenter = getTriangleCenter(r, c);

            renderCx =
              sourceCenter.x * (1 - t) +
              destCenter.x * t +
              (dragOffset ? dragOffset.x : 0);
            renderCy =
              sourceCenter.y * (1 - t) +
              destCenter.y * t +
              (dragOffset ? dragOffset.y : 0);

            // 2. Shape Morph (If Odd slots)
            if (totalSlots % 2 !== 0) {
              const destUp = isPointingUp(r, c);
              vertices = getMorphedVertices(
                destUp,
                t,
                TRIANGLE_WIDTH,
                TRIANGLE_HEIGHT
              );
            }
          } else {
            // Standard fallback logic for Diagonals
            renderCx += -1 * cell.animDist * dir * config.x;
            renderCy += -1 * cell.animDist * dir * config.y;
          }
        }

        ctx.save();
        ctx.translate(renderCx, renderCy);

        ctx.beginPath();
        if (vertices) {
          ctx.moveTo(vertices[0].x, vertices[0].y);
          ctx.lineTo(vertices[1].x, vertices[1].y);
          ctx.lineTo(vertices[2].x, vertices[2].y);
          ctx.closePath();
        } else {
          // Standard Draw
          const up = isPointingUp(r, c);
          drawTriangleShape(
            ctx,
            r,
            c,
            0,
            0,
            TRIANGLE_WIDTH,
            TRIANGLE_HEIGHT,
            up,
            0
          );
        }

        if (
          grid[r] &&
          grid[r][c] &&
          ["bomb", "flower"].includes(grid[r][c].type)
        ) {
          ctx.fillStyle = "#475569"; // Slate 600 (Neutral) - Colorless for bombs only
        } else {
          ctx.fillStyle = color;
        }

        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = Math.max(2, TRIANGLE_WIDTH * 0.05);
        ctx.lineJoin = "round";
        ctx.fill();
        ctx.stroke();

        if (!isGhost) {
          ctx.fillStyle = "rgba(255,255,255,0.1)";
          ctx.fill();
        } else {
          ctx.fillStyle = "rgba(0,0,0,0.2)";
          ctx.fill();
        }

        // Render Bomb/Wipe Icon (Simplified for morphed state, drawn at new 0,0)
        if (
          grid[r] &&
          grid[r][c] &&
          ["bomb", "wipe", "flower"].includes(grid[r][c].type)
        ) {
          const cx = 0;
          const cy = 0;
          // Differentiate between bomb and wipe icons
          const cellType = grid[r][c].type;
          // REDUCED SIZE 50% for all icons
          const iconScale = 0.5;

          if (cellType === "wipe") {
            // Wipe Icon: Double circle with radiating lines
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.beginPath();
            ctx.arc(cx, cy, TRIANGLE_WIDTH * 0.2 * iconScale, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, TRIANGLE_WIDTH * 0.3 * iconScale, 0, Math.PI * 2);
            ctx.stroke();

            // Radiating lines
            for (let i = 0; i < 4; i++) {
              const angle = (i * Math.PI) / 2 + Math.PI / 4;
              const r1 = TRIANGLE_WIDTH * 0.32 * iconScale;
              const r2 = TRIANGLE_WIDTH * 0.42 * iconScale;
              ctx.beginPath();
              ctx.moveTo(cx + Math.cos(angle) * r1, cy + Math.sin(angle) * r1);
              ctx.lineTo(cx + Math.cos(angle) * r2, cy + Math.sin(angle) * r2);
              ctx.stroke();
            }
          } else if (cellType === "bomb") {
            // Bomb Icon: Single circle with fuse
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.beginPath();
            ctx.arc(cx, cy, TRIANGLE_WIDTH * 0.25 * iconScale, 0, Math.PI * 2);
            ctx.fill();

            // Fuse
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.beginPath();

            let angle = 0; // Default horiz
            if (grid[r][c].bombAxis === "diagA") angle = Math.PI / 3; // 60 deg
            else if (grid[r][c].bombAxis === "diagB") angle = -Math.PI / 3; // -60 deg

            const lineLen = TRIANGLE_WIDTH * 0.6 * iconScale;
            const lx = Math.cos(angle) * lineLen;
            const ly = Math.sin(angle) * lineLen;

            ctx.moveTo(cx - lx, cy - ly);
            ctx.lineTo(cx + lx, cy + ly);
            ctx.stroke();

            // Spark
            ctx.fillStyle = "#fbbf24";
            ctx.beginPath();
            ctx.arc(cx, cy, 2, 0, Math.PI * 2);
            ctx.fill();
          } else if (cellType === "flower") {
            // Flower Icon
            const radius = TRIANGLE_WIDTH * 0.15 * iconScale;

            // Center dot
            ctx.fillStyle = "#fbbf24";
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();

            // Petals
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            for (let i = 0; i < 6; i++) {
              const angle = (i * Math.PI) / 3;
              const dist = TRIANGLE_WIDTH * 0.25 * iconScale;
              const px = cx + Math.cos(angle) * dist;
              const py = cy + Math.sin(angle) * dist;
              ctx.beginPath();
              ctx.arc(px, py, radius * 0.8, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
        }
        ctx.restore();
      }

      function findLogicalNeighbor(r, c, axis, direction) {
        if (axis === "horiz") return { r: r, c: c + direction };
        if (axis === "diagA") {
          const k = Math.ceil((c - r) / 2);
          const candidates = [
            { r: r + 1 * direction, c: c },
            { r: r, c: c + 1 * direction },
            { r: r + 1 * direction, c: c + 1 * direction },
          ];
          return (
            candidates.find(
              (cand) => Math.ceil((cand.c - cand.r) / 2) === k
            ) || { r: r + direction, c: c + direction }
          );
        }
        if (axis === "diagB") {
          const k = Math.floor((c + r) / 2);
          const candidates = [
            { r: r - 1 * direction, c: c },
            { r: r, c: c + 1 * direction },
            { r: r - 1 * direction, c: c + 1 * direction },
          ];
          return (
            candidates.find(
              (cand) => Math.floor((cand.c + cand.r) / 2) === k
            ) || { r: r - direction, c: c + direction }
          );
        }
      }

      function drawContour(matchCells) {
        const edges = new Map();

        matchCells.forEach((p) => {
          let renderX = 0;
          let renderY = 0;
          if (
            (drag.active || drag.isAnimating) &&
            drag.strip.some((s) => s.r === p.r && s.c === p.c)
          ) {
            const config = axisConfig[drag.lockedAxis];
            renderX = drag.pixelOffset * config.x;
            renderY = drag.pixelOffset * config.y;
          }

          const center = getTriangleCenter(p.r, p.c);
          const cx = center.x + renderX;
          const cy = center.y + renderY;
          const up = isPointingUp(p.r, p.c);
          const w = TRIANGLE_WIDTH;
          const h = TRIANGLE_HEIGHT;

          let v1, v2, v3;
          if (up) {
            v1 = { x: cx, y: cy - 0.66 * h };
            v2 = { x: cx + 0.5 * w, y: cy + 0.33 * h };
            v3 = { x: cx - 0.5 * w, y: cy + 0.33 * h };
          } else {
            v1 = { x: cx - 0.5 * w, y: cy - 0.33 * h };
            v2 = { x: cx + 0.5 * w, y: cy - 0.33 * h };
            v3 = { x: cx, y: cy + 0.66 * h };
          }

          const addEdge = (a, b) => {
            const ka = `${Math.round(a.x * 10)},${Math.round(a.y * 10)}`;
            const kb = `${Math.round(b.x * 10)},${Math.round(b.y * 10)}`;
            const key = ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`;
            edges.set(key, (edges.get(key) || 0) + 1);
          };

          addEdge(v1, v2);
          addEdge(v2, v3);
          addEdge(v3, v1);
        });

        ctx.beginPath();
        edges.forEach((count, key) => {
          if (count === 1) {
            const [p1, p2] = key.split("|");
            const [x1, y1] = p1.split(",").map((n) => parseInt(n) / 10);
            const [x2, y2] = p2.split(",").map((n) => parseInt(n) / 10);
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
          }
        });

        const alpha = 0.5 + (Math.sin(time * 0.005) + 1) * 0.25;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = 5;
        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = "white";
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      function render(timestamp) {
        time = timestamp;

        // --- DELTA TIME CALCULATION ---
        if (!lastTime) lastTime = timestamp;
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        // Cap DeltaTime to prevent "spiraling" if tab is backgrounded
        // Max lag compensation: 100ms
        const cappedDelta = Math.min(deltaTime, 100);

        // Calculate factor relative to 120fps (approx 8.33ms per frame)
        // If running at 60fps (16.6ms), dtFactor will be ~2.0
        const dtFactor = cappedDelta / TARGET_MS_PER_FRAME;

        // --- FPS CALCULATION ---
        frameCount++;
        if (timestamp - lastFpsTime >= 1000) {
          if (DEBUG) {
            fpsEl.innerText = `FPS: ${frameCount}`;
          }
          frameCount = 0;
          lastFpsTime = timestamp;
        }

        updatePhysics(dtFactor);
        updateFallingPhysics(dtFactor);

        // Background
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grand Finale Effect
        if (
          movesLeft === 0 &&
          (isProcessingMatches ||
            isFalling ||
            checkQueue.length > 0 ||
            bombEffects.length > 0 ||
            flowerEffects.length > 0)
        ) {
          const pulse = (Math.sin(time * 0.002) + 1) / 2; // 0 to 1
          const gradient = ctx.createLinearGradient(
            0,
            0,
            canvas.width,
            canvas.height
          );
          // Subtle purple/gold shift overlay
          gradient.addColorStop(0, `rgba(100, 50, 255, ${0.1 + pulse * 0.1})`);
          gradient.addColorStop(1, `rgba(255, 215, 0, ${0.05 + pulse * 0.05})`);
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.save();

        // ROTATION: Rotate 90 degrees clockwise around center
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(Math.PI / 2);
        ctx.translate(-canvas.width / 2, -canvas.height / 2);

        // Render Bomb Effects (Underlay or Overlay? Overlay is better for blast)
        // Actually, let's do it AFTER the grid so it glows on top.

        ctx.beginPath();
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const center = getTriangleCenter(r, c);
            const up = isPointingUp(r, c);
            drawTriangleShape(
              ctx,
              r,
              c,
              center.x,
              center.y,
              TRIANGLE_WIDTH,
              TRIANGLE_HEIGHT,
              up,
              2
            );
          }
        }
        ctx.clip();

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const isDragged =
              (drag.active || drag.isAnimating) &&
              drag.strip.some((p) => p.r === r && p.c === c);
            if (!isDragged) {
              drawTriangle(r, c, null);
            }
          }
        }

        if ((drag.active || drag.isAnimating) && drag.strip.length > 0) {
          const config = axisConfig[drag.lockedAxis];
          const vx = drag.pixelOffset * config.x;
          const vy = drag.pixelOffset * config.y;

          const ghostForward = [];
          const ghostBackward = [];
          const len = drag.strip.length;

          let curr = drag.strip[len - 1];
          for (let i = 0; i < len; i++) {
            const next = findLogicalNeighbor(
              curr.r,
              curr.c,
              drag.lockedAxis,
              1
            );
            ghostForward.push(next);
            curr = next;
          }

          curr = drag.strip[0];
          const temp = [];
          for (let i = 0; i < len; i++) {
            const prev = findLogicalNeighbor(
              curr.r,
              curr.c,
              drag.lockedAxis,
              -1
            );
            temp.push(prev);
            curr = prev;
          }
          for (let i = len - 1; i >= 0; i--) ghostBackward.push(temp[i]);

          drag.strip.forEach((pos, i) => {
            const color = grid[pos.r][pos.c].color;
            const cellType = grid[pos.r][pos.c].type;
            drawTriangle(pos.r, pos.c, { x: vx, y: vy }, color);

            if (ghostForward[i]) {
              const gf = ghostForward[i];
              // Check if ghost position is within bounds
              if (grid[gf.r] && grid[gf.r][gf.c]) {
                // Temporarily set the ghost position's type to match the original cell
                const originalType = grid[gf.r][gf.c].type;
                grid[gf.r][gf.c].type = cellType;
                drawTriangle(gf.r, gf.c, { x: vx, y: vy }, color);
